<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도형으로 살아남기: 무인도 탈출</title>
<style>
:root{--ink:#eaf4ef;--muted:#afc4bc;--gold:#f4c878;--green:#8fd5b2}*{box-sizing:border-box}body{margin:0;background:#0c1c1b;color:var(--ink);font-family:'Malgun Gothic',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ffffff30;border-radius:10px;background:#203934;color:var(--ink);padding:12px 18px;font-weight:700;transition:.18s}button:hover{background:#35564b;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default;transform:none}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--gold);color:#253127;border-color:var(--gold)}.primary:hover{background:#ffdda0}.small{padding:8px 12px;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 4vw;border-bottom:1px solid #ffffff16}.brand{font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.tools{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1500px;margin:auto;padding:24px 4vw 35px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:800}h1{font-size:clamp(30px,4vw,54px);line-height:1.2;margin:14px 0}h2{font-size:24px;margin:10px 0 16px}h3{margin:10px 0}p{line-height:1.8;color:var(--muted);margin:10px 0 20px}.hero{position:relative;min-height:650px;display:flex;align-items:end;border-radius:20px;overflow:hidden;background-size:cover;background-position:center}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#061b19ef,#061b1950 75%),linear-gradient(0deg,#061b19cc,transparent)}.heroContent{position:relative;max-width:720px;padding:50px}.heroContent p{color:#d0ded6;font-size:17px}.tags{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tag{border:1px solid #ffffff30;border-radius:30px;padding:7px 12px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);gap:24px}.scene{width:100%;display:block;aspect-ratio:1672/941;object-fit:cover;border-radius:16px}.sceneBox{position:relative}.caption{background:#182d29;padding:20px;border-radius:14px;margin-top:14px}.caption p{margin:6px 0}.panel{background:#142b27;border:1px solid #ffffff16;border-radius:16px;padding:25px}.progress{display:flex;gap:7px;margin:0 0 23px}.step{flex:1;height:5px;border-radius:8px;background:#ffffff18}.step.done{background:var(--green)}.step.active{background:var(--gold)}.choices{display:grid;gap:10px}.choice{text-align:left;line-height:1.65;background:#1b3730}.choice strong{color:var(--gold)}.feedback{padding:14px;border-radius:10px;margin-top:15px;line-height:1.7;background:#21382e;color:#e8d1a4}.feedback.ok{background:#214c3b;color:#c7f4d8}.feedback.bad{background:#50352c;color:#ffd8ba}.hidden{display:none!important}.next{width:100%;margin-top:14px}.drawing{width:100%;border-radius:12px;background:#f1e5c9;color:#302e23;display:block;margin:14px 0;touch-action:none}svg text{font-family:inherit;font-size:16px;fill:#302e23;paint-order:stroke;stroke:#f1e5c9;stroke-width:3px;stroke-linejoin:round}svg .line{stroke:#425743;stroke-width:3;fill:none}svg .guide{stroke:#ca7d29;stroke-width:2;stroke-dasharray:7 5;fill:none}.readings{font-size:14px;color:var(--gold);line-height:1.8}input[type=range]{width:100%;accent-color:var(--gold)}.inventory{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.item{font-size:12px;color:#b9dfc6;border:1px solid #486353;padding:7px 10px;border-radius:6px}.chapterhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.chapterhead h1{font-size:32px;margin-bottom:0}.hint{font-size:14px;color:#dcca9d}.status{font-size:13px;color:var(--muted)}dialog{background:#16312b;color:var(--ink);border:1px solid #ffffff40;border-radius:18px;max-width:730px;width:90%;max-height:85vh;padding:28px}dialog::backdrop{background:#000b}dialog p{color:#d5e3dc}select{padding:12px;background:#243f34;color:white;border-radius:8px;max-width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.assembly{font-size:45px;text-align:center;letter-spacing:10px;padding:20px 0}.beam{position:absolute;inset:0;background:conic-gradient(from 245deg at 65% 25%,transparent 0deg,#fff6ac88 20deg,transparent 40deg);animation:shine 3s infinite alternate;pointer-events:none}@keyframes shine{to{opacity:.25}}footer{font-size:12px;text-align:center;color:#7d9c8e;padding:10px 0 20px}.record{background:#eadcb9;color:#423d2a;padding:16px 22px;border-radius:8px;line-height:1.9}.record p{color:inherit;margin:0}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:950px){.layout{grid-template-columns:1fr}.hero{min-height:600px}.heroContent{padding:28px}.panel{padding:20px}header{align-items:start}.brand{font-size:14px}.chapterhead h1{font-size:27px}}@media print{header,.tools,button{display:none}body{background:white;color:black}dialog{position:static;max-height:none}p{color:#333}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand">◈ <span>도형으로 살아남기</span> / 무인도 탈출</div><div class="tools"><button class="small" onclick="showMap()">탐사 지도</button><button class="small" onclick="teacher()">교사용 메뉴</button><button class="small" onclick="full()">전체 화면</button></div></header><main id="app"></main><footer>함께 관찰하고, 근거를 말하고, 도전하세요. · 인터넷 연결 없이 실행되는 수학 탐험</footer><dialog id="modal"></dialog>
<script>
const images=["images/01-images.webp","images/02-img.webp","images/03-img.webp","images/04-img.webp","images/05-img.webp","images/06-img.webp","images/07-img.webp"];
const titles=['무너진 계곡 다리','해안 감시초소','오늘 밤을 버텨라','처진 구조 창고','구조용 뗏목','마지막 신호'];
const concepts=['직각삼각형의 합동','삼각형의 외심','삼각형의 내심','평행사변형이 되는 조건','직사각형의 대각선','마름모의 성질'];
const stories=['폭풍에 배가 파손되고 통신마저 끊겼다. 섬 정상의 오래된 해양 구조 신호탑이 유일한 희망이다. 계곡 다리의 떨어진 직각삼각형 보강재부터 복구하자.','다리를 건너 도착한 감시초소. 낡은 기록에서 단서를 발견했다. “비상 송신기는 세 관측소 A, B, C에서 같은 거리에 있는 곳에 보관하였다.”','해가 지기 시작했다. 삼각형 내부를 캠프 후보 지역으로 정하고, 밀물·낙석·독성 식물의 세 경계선으로부터 최소 거리가 가장 큰 곳을 찾자.','신호탑 수리 도구가 든 창고를 찾았다. 구조가 처져 직사각형 문이 문틀에 걸린다. 문은 그대로 두고, 문 옆 보강 틀에 필요한 조건을 갖추자.','정상으로 가는 길이 낙석으로 막혔다. 목재와 밧줄로 뗏목을 만들어 해안으로 우회하자. 바깥 틀은 이미 두 쌍의 대변이 평행하게 연결되어 있다.','마침내 도착한 구조 신호탑. 전원은 살아 있지만 반사판이 없다. 보관함의 후보 중 정비 기록을 모두 만족하는 반사판을 찾아 빛을 밝혀라.'];
const explanations=['모든 후보는 직각삼각형이다. 빗변 10 m와 다른 한 변 6 m가 각각 같으면 RHS 합동이다. 빗변 10 m와 대응하는 예각 35°가 각각 같으면 RHA 합동이다.','외심은 세 변의 수직이등분선의 교점이다. 외심 O에서 세 꼭짓점까지 OA = OB = OC이다. 외심은 삼각형 모양에 따라 내부·변 위·외부에 놓일 수 있다.','내심은 세 내각의 이등분선의 교점이다. 내심에서 세 변에 내린 수선의 길이는 같다. 삼각형 내부에서 가장 가까운 경계선까지의 거리를 최대화하는 위치다. 실제 재난의 안전을 보장하는 모형은 아니다.','단순한 사각형에서 두 쌍의 대변이 각각 평행하거나, 각각 길이가 같거나, 한 쌍의 대변이 평행하고 길이가 같거나, 두 대각선이 서로를 이등분하면 평행사변형이다. 게임에서는 이 조건으로 보강 틀을 확인한다. 실제 구조물은 접합부 고정과 추가 지지가 필요하다.','평행사변형에서 두 대각선의 길이가 같으면 직사각형이다. 임의의 사각형은 대각선 길이만 같다고 직사각형이 되지 않는다. 예를 들어 등변사다리꼴도 두 대각선의 길이가 같다.','네 변이 같고, 대각선이 서로를 수직이등분하는 마름모를 선택한다. 정사각형도 마름모이지만, 기록 ⑤ “네 각이 모두 직각인 것은 아니다”를 만족하지 않으므로 제외한다.'];
const rewards=['다리 복구','비상 송신기 · 지도','안전 캠프','목재 · 밧줄 · 망치 · 볼트 · 연결판 · 수리 도구','뗏목','구조 신호'];
let state={chapter:-1,done:[],mistakes:0},phase=0,solved=false,point=null,guides=false,offset=2;const key='island-math-escape-v1';
try{let s=JSON.parse(localStorage.getItem(key));if(s&&Number.isInteger(s.chapter)&&s.chapter>=-1&&s.chapter<=6&&Array.isArray(s.done))state=s}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);function dialog(html){$('#modal').innerHTML=html+'<div class="btnrow"><button onclick="this.closest(\'dialog\').close()">닫기</button></div>';$('#modal').showModal()}
function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}
function home(){const resume=state.chapter>=0;$('#app').innerHTML=`<section class="hero" style="background-image:url('${images[6]}')"><div class="heroContent"><div class="eyebrow">GEOMETRY SURVIVAL · 협동 수학 탐험</div><h1>도형으로 살아남기<br><span style="color:var(--gold)">무인도 탈출</span></h1><p>친구들과 도형의 비밀을 풀고,<br>구조 신호를 밝혀라!</p><div class="tags"><span class="tag">6개의 수학 미션</span><span class="tag">모둠 토의 · 공동 선택</span><span class="tag">시간 제한 없음</span></div><div class="btnrow"><button class="primary" onclick="enter(${resume?state.chapter:0})">${resume?'탐험 이어하기':'탐험 시작하기'} →</button><button onclick="how()">수업 진행 안내</button></div><p style="font-size:12px">진행은 이 브라우저에 자동 저장됩니다. 저장이 제한된 환경에서도 플레이할 수 있습니다.</p></div></section>`}
function how(){dialog('<h2>우리 반의 탈출 규칙</h2><p>① 모둠별로 도형을 관찰합니다.<br>② 정답과 그 이유를 먼저 토의합니다.<br>③ 대표 학생이 화면을 조작합니다.<br>④ 성공 후 개념을 함께 확인합니다.</p><p>틀려도 다시 도전할 수 있고 시간 제한은 없습니다. 지도는 클릭하거나, 초점을 맞추고 방향키로 탐색합니다. 교사용 메뉴에서 챕터를 자유롭게 이동하고 해설을 확인할 수 있습니다.</p>')}
function enter(c){state.chapter=c;phase=0;solved=false;point=null;guides=false;offset=2;save();if(c===6){ending();return}render();window.scrollTo(0,0)}
function render(){let c=state.chapter;$('#app').innerHTML=`<div class="progress">${titles.map((_,i)=>`<div class="step ${state.done.includes(i)?'done':i===c?'active':''}"></div>`).join('')}</div><div class="chapterhead"><div><div class="eyebrow">CHAPTER 0${c+1} / 06</div><h1>${titles[c]}</h1></div><span class="status">${state.done.length} / 6 탐사 완료</span></div><div class="layout"><section><div class="sceneBox"><img class="scene" src="${images[c]}" alt="${titles[c]} 탐험 장면"><div id="effect"></div></div><div class="caption"><div class="eyebrow">탐사 일지</div><p>${stories[c]}</p></div><div class="inventory">${state.done.map(i=>`<span class="item">✓ ${rewards[i]}</span>`).join('')}</div></section><section class="panel"><div class="eyebrow">MISSION · ${concepts[c]}</div><div id="puzzle"></div><div id="feedback" aria-live="polite"></div><button id="next" class="primary next hidden" onclick="advance()">다음 장소로 →</button></section></div>`;puzzle()}
function say(text,ok=false){$('#feedback').className='feedback '+(ok?'ok':'bad');$('#feedback').innerHTML=text;if(!ok){state.mistakes++;save()}}
function complete(text){solved=true;if(!state.done.includes(state.chapter))state.done.push(state.chapter);save();say('✓ '+text+'<br><small>'+explanations[state.chapter]+'</small>',true);$('#next').classList.remove('hidden');$('#puzzle').querySelectorAll('button,input').forEach(x=>x.disabled=true)}
function choices(arr){return '<div class="choices">'+arr.map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join('')+'</div>'}
function puzzle(){let c=state.chapter;$('#feedback').className='';$('#feedback').innerHTML='';let html='';if(c===0){html=`<h2>합동인 보강재를 고르세요</h2><p>복구 ${phase+1} / 2 · 모든 후보는 직각삼각형입니다.</p><svg class="drawing" viewBox="0 0 460 180"><path class="line" d="M100 30 L100 145 L340 145 Z"/><path class="line" d="M100 130 H115 V145"/><text x="205" y="65">빗변 10 m</text>${phase===0?'<text x="25" y="100">6 m</text>':'<text x="263" y="136">35°</text>'}<text x="173" y="171">남아 있는 지지대</text></svg>`+choices(phase===0?['A · 빗변 10 m, 다른 한 변 5 m','B · 빗변 10 m, 다른 한 변 6 m','C · 빗변 12 m, 다른 한 변 6 m']:['A · 빗변 10 m, 한 예각 35°','B · 빗변 8 m, 한 예각 35°','C · 빗변 10 m, 한 예각 40°']);}if(c===1||c===2){html=`<h2>${c===1?'송신기는 어디에 있을까요?':'텐트를 놓을 위치를 찾으세요'}</h2><p>${c===1?'세 관측소까지의 거리가 같아지도록 지도를 클릭하세요.':'삼각형 내부에서 세 경계선까지의 수직 거리가 같아지는 곳을 클릭하세요.'}</p><div id="mapArea"></div><div class="readings" id="readings">지도 위 한 점을 선택하세요.</div><div class="btnrow"><button class="small" onclick="guides=!guides;drawMap()">보조선 켜기 / 끄기</button><button class="primary" onclick="checkPoint()">${c===1?'이곳 탐색하기':'이곳에 캠프 설치'}</button></div><p class="hint">방향키로 5씩 이동 · Shift + 방향키로 1씩 이동 · Enter로 확인</p>`}if(c===3){html='<h2>문 옆의 보강 틀을 확인하세요</h2><p>설치할 보강 틀 ABCD는 단순한 사각형입니다. 어떤 기록만으로 평행사변형임을 보장할 수 있을까요? <b>네 가지</b>를 모두 고르세요.</p><svg class="drawing" viewBox="0 0 460 170"><path class="line" d="M100 140 L150 30 L370 30 L320 140 Z M100 140 L370 30 M150 30 L320 140"/><text x="132" y="24">A</text><text x="374" y="30">B</text><text x="328" y="154">C</text><text x="80" y="154">D</text><text x="229" y="81">O</text></svg><div class="choices">'+['두 쌍의 대변이 각각 평행하다','두 쌍의 대변의 길이가 각각 같다','한 쌍의 대변이 평행하고 그 길이가 같다','두 대각선이 서로를 이등분한다','두 대각선의 길이만 같다','한 쌍의 대변의 길이만 같다'].map((v,i)=>`<label class="choice" style="padding:12px;border-radius:8px"><input type="checkbox" value="${i}"> ${v}</label>`).join('')+'</div><button class="primary next" onclick="checkFrame()">조건 확인하고 보강재 설치</button>'}if(c===4){html='<h2>두 대각선을 같게 맞추세요</h2><p>대변의 평행을 유지한 채 윗변을 좌우로 움직입니다. 가로 8 m, 높이 6 m인 틀입니다.</p><div id="raft"></div><label for="shift">윗변의 좌우 이동량</label><input id="shift" type="range" min="-3" max="3" step="0.1" value="2" oninput="offset=+this.value;drawRaft()"><div class="readings" id="diags"></div><button class="primary next" onclick="checkRaft()">이 모양으로 틀 고정</button>'}if(c===5){html='<h2>원래의 반사판을 찾아라</h2><div class="record">① 네 변의 길이가 모두 같다.<br>② 마주 보는 두 각이 각각 같다.<br>③ 두 대각선은 서로를 이등분한다.<br>④ 두 대각선은 서로 수직이다.<br>⑤ 네 각이 모두 직각인 것은 아니다.</div><p>기록 5개를 모두 만족하는 후보를 고르세요.</p>'+choices(['▭ 직사각형 (가로 ≠ 세로)','▱ 평행사변형 (이웃한 변의 길이가 다름)','◇ 마름모 (예각 60°, 둔각 120°)','⏢ 사다리꼴 (한 쌍의 대변만 평행)','□ 정사각형']);}$('#puzzle').innerHTML=html;if(c===1||c===2)drawMap();if(c===4)drawRaft()}
function answer(i){if(solved)return;let c=state.chapter;if(c===0){if(i!==(phase===0?1:0)){say(phase===0?'빗변과 다른 한 변을 모두 비교해 보세요. 한 길이만 같아서는 부족합니다.':'각이 같아도 크기가 다를 수 있어요. 빗변도 같은지 확인하세요.');return}if(phase===0){phase=1;puzzle();say('✓ 첫 번째 보강재 설치! 이번에는 빗변과 한 예각을 비교하세요.',true)}else complete('두 보강재를 설치했습니다. 다리가 안정되어 계곡을 건넙니다.')}else if(c===5){if(i===2){$('#effect').className='beam';complete('마름모 반사판 설치 완료. 구조 신호를 송신합니다!')}else say(i===4?'정사각형은 ①~④를 만족하지만 ⑤를 만족하지 않습니다. 네 각을 다시 살펴보세요.':'네 변의 길이와 대각선의 성질을 기록과 하나씩 대조해 보세요.')}}
const A={x:220,y:50},B={x:65,y:285},C={x:420,y:285};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const circum={x:242.5,y:233.45744680851064};const sides=[dist(B,C),dist(A,C),dist(A,B)];const inc={x:(sides[0]*A.x+sides[1]*B.x+sides[2]*C.x)/sides.reduce((a,b)=>a+b),y:(sides[0]*A.y+sides[1]*B.y+sides[2]*C.y)/sides.reduce((a,b)=>a+b)};
function foot(p,a,b){let t=((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/dist(a,b)**2;return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)}}
function ln(a,b,cls='guide'){return `<line class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}
function drawMap(){let c=state.chapter,target=c===1?circum:inc;let lines='';if(guides){if(c===1){[[A,B],[B,C],[C,A]].forEach(([a,b])=>{let m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},v={x:-(b.y-a.y),y:b.x-a.x};lines+=ln({x:m.x-v.x*2,y:m.y-v.y*2},{x:m.x+v.x*2,y:m.y+v.y*2})})}else[A,B,C].forEach(a=>lines+=ln(a,{x:a.x+(target.x-a.x)*2,y:a.y+(target.y-a.y)*2}))}if(point){if(c===1)[A,B,C].forEach(a=>lines+=ln(point,a));else [[A,B],[B,C],[C,A]].forEach(([a,b])=>lines+=ln(point,foot(point,a,b)))}$('#mapArea').innerHTML=`<svg id="geomap" class="drawing" viewBox="0 0 480 340" tabindex="0" role="application" aria-label="위치 탐색 지도. 클릭 또는 방향키로 점을 이동하고 Enter로 확인"><path d="M220 50 L65 285 L420 285Z" fill="#bccba366" stroke="#415f48" stroke-width="3"/>${lines}${c===1?[A,B,C].map((a,i)=>`<circle cx="${a.x}" cy="${a.y}" r="5" fill="#35543b"/><text x="${a.x+9}" y="${a.y-10}">${'ABC'[i]}</text>`).join(''):'<text x="61" y="157">낙석 경계</text><text x="315" y="156">독성 식물 경계</text><text x="190" y="315">밀물 경계</text>'}${point?`<circle cx="${point.x}" cy="${point.y}" r="8" fill="#d77629" stroke="white" stroke-width="3"/><text x="${point.x+12}" y="${point.y-9}">선택 지점</text>`:''}</svg>`;let svg=$('#geomap');svg.onclick=e=>{if(solved)return;const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;let pos=q.matrixTransform(svg.getScreenCTM().inverse());point={x:Math.max(0,Math.min(480,pos.x)),y:Math.max(0,Math.min(340,pos.y))};drawMap()};svg.onkeydown=e=>{if(solved)return;if(e.key==='Enter'){checkPoint();return}let dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!dirs[e.key])return;e.preventDefault();point=point||{x:240,y:170};point.x=Math.max(0,Math.min(480,point.x+dirs[e.key][0]*(e.shiftKey?1:5)));point.y=Math.max(0,Math.min(340,point.y+dirs[e.key][1]*(e.shiftKey?1:5)));drawMap();$('#geomap').focus()};if(point){let vals=c===1?[A,B,C].map(a=>dist(point,a)):[[A,B],[B,C],[C,A]].map(([a,b])=>dist(point,foot(point,a,b)));$('#readings').textContent=(c===1?'A / B / C까지 거리: ':'세 경계선까지 수직 거리: ')+vals.map(v=>(v/10).toFixed(1)).join(' / ')+' (지도 단위)'}}
function checkPoint(){if(solved)return;if(!point){say('먼저 지도 위에서 위치를 선택하세요.');return}let t=state.chapter===1?circum:inc;if(dist(point,t)>10){say(state.chapter===1?'세 관측소까지 거리가 아직 다릅니다. 수직이등분선이 만나는 곳을 찾아보세요.':'세 경계선까지의 수직 거리를 비교하세요. 삼각형 내부에서 각의 이등분선이 만나는 곳을 찾아보세요.');return}point={...t};guides=true;drawMap();if(state.chapter===1)complete('외심에서 비상 송신기와 신호탑 지도를 발견했습니다.');else{say('✓ 내심을 찾았습니다! 이제 순서대로 텐트를 세우세요.',true);assembly('tent')}}
function assembly(kind){phase=0;const order=kind==='tent'?['텐트 펼치기','폴대 설치','팩 고정','줄 당기기']:['통나무 올리기','밧줄로 묶기','연결부 고정'];const scrambled=kind==='tent'?[2,0,3,1]:[1,2,0];$('#puzzle').innerHTML='<h2>'+(kind==='tent'?'우리의 안전 캠프':'뗏목을 완성하세요')+'</h2><p>작업 순서를 생각해 버튼을 선택하세요.</p><div class="assembly" id="buildIcon">'+(kind==='tent'?'▱':'🪵')+'</div><div class="choices">'+scrambled.map(i=>`<button data-step="${i}">${order[i]}</button>`).join('')+'</div><p id="buildStatus" class="readings">완료 0 / '+order.length+'</p>';$('#puzzle').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.step;if(i!==phase){say('아직 그 작업을 할 단계가 아니에요. '+order[phase]+'부터 시작하세요.');return}b.disabled=true;b.textContent='✓ '+order[i];phase++;$('#buildStatus').textContent='완료 '+phase+' / '+order.length;say('✓ '+order[i]+' 완료',true);if(phase===order.length){$('#buildIcon').textContent=kind==='tent'?'⛺':'🛶';complete(kind==='tent'?'텐트가 완성되었습니다. 안전한 캠프에서 밤을 보냅니다.':'뗏목 완성! 해안을 따라 신호탑 반대편으로 이동합니다.')}})}
function checkFrame(){let v=[...$('#puzzle').querySelectorAll('input:checked')].map(x=>+x.value);if(v.length===4&&v.every(x=>x<4))complete('보강 틀을 확인하고 연결판과 볼트로 고정했습니다. 문이 열리고 수리 도구를 얻었습니다.');else say('조건이 충분한지 확인하세요. 대각선의 길이만 같은 사각형, 한 쌍의 변만 같은 사각형도 평행사변형일까요?')}
function drawRaft(){let s=offset*25;$('#raft').innerHTML=`<svg class="drawing" viewBox="0 0 480 270"><path d="M120 225 L320 225 L${320+s} 75 L${120+s} 75Z" fill="#ad97503a" stroke="#846239" stroke-width="12" stroke-linejoin="round"/><path d="M120 225 L${320+s} 75 M320 225 L${120+s} 75" stroke="#ad5e29" stroke-width="2" stroke-dasharray="7 5"/><text x="200" y="254">8 m</text><text x="${335+s}" y="155">6 m</text></svg>`;$('#diags').textContent='이동량 '+offset.toFixed(1)+' m · 대각선 ① '+Math.hypot(8+offset,6).toFixed(2)+' m / ② '+Math.hypot(8-offset,6).toFixed(2)+' m'}
function checkRaft(){if(Math.abs(offset)>.001){say('두 대각선 길이가 다릅니다. 윗변을 조금 더 조정하세요.');return}say('✓ 대각선이 각각 10 m! 평행사변형인 틀이 직사각형이 되었습니다.',true);assembly('raft')}
function advance(){if(!solved)return;if(state.chapter===3){$('#app').innerHTML=`<section class="hero" style="background-image:url('${images[2]}')"><div class="heroContent"><div class="eyebrow">STORY EVENT · 예상하지 못한 소식</div><h1>길이 사라졌다</h1><p>캠프로 돌아온 순간, 산 쪽에서 굉음이 들립니다.<br>밤사이 약해진 비탈이 무너지며 정상으로 향하는 길을 막았습니다.</p><p>위험 경계에서 떨어진 곳에 설치한 캠프는 무사합니다.<br>지도를 펼치자 바다와 연결된 반대편 접근로가 보입니다.</p><h2>“목재와 밧줄로 뗏목을 만들자!”</h2><button class="primary" onclick="enter(4)">해변으로 이동 →</button></div></section>`}else enter(state.chapter+1)}
function ending(){$('#app').innerHTML=`<section class="hero" style="background-image:url('${images[5]}')"><div class="beam"></div><div class="heroContent"><div class="eyebrow">RESCUE CONFIRMED · 탐험 완료</div><h1>우리가 밝힌 빛,<br>구조선에 닿다.</h1><p>한동안 고요하던 수평선에 작은 불빛이 깜빡입니다.<br>비상 송신기에서 잡음 섞인 목소리가 들려옵니다.</p><h2>“구조 신호 확인. 위치를 확인했습니다.”</h2><p>구조선이 섬을 향해 방향을 바꿉니다. 다리와 감시초소,<br>무사한 텐트, 창고와 뗏목까지. 우리가 함께 만든 탈출 경로입니다.</p><div class="tags"><span class="tag">${state.done.length} / 6 미션 완료</span><span class="tag">다시 도전한 횟수 ${state.mistakes}</span></div><div class="btnrow"><button class="primary" onclick="review()">탐험 학습 일지</button><button onclick="restart()">처음부터 다시</button></div></div></section>`}
function review(){dialog('<h2>탐험 학습 일지</h2>'+concepts.map((v,i)=>'<h3>'+ (i+1)+'. '+v+'</h3><p>'+explanations[i]+'</p>').join('')+'<p><b>함께 이야기해요:</b> 외심과 내심에서 말하는 “같은 거리”는 각각 무엇까지의 거리인가요? 안테나 지지틀을 정사각형으로 만들려면 두 지지대를 어떻게 조절해야 하나요?</p>')}

function teacher(){dialog('<h2>교사용 메뉴</h2><p>수업 상황에 맞게 챕터를 바로 열 수 있습니다. 직접 이동한 미션은 풀어야 완료로 기록됩니다.</p><select id="jump" aria-label="이동할 챕터">'+titles.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v+'</option>').join('')+'</select><div class="btnrow"><button class="primary" onclick="let c=+document.querySelector(\'#jump\').value;document.querySelector(\'#modal\').close();enter(c)">선택 챕터 열기</button><button onclick="document.querySelector(\'#modal\').close();review()">전체 해설 보기</button><button onclick="restart()">진행 초기화</button></div><p>권장 운영: 모둠 토의 후 대표 조작 · 미션당 4~6분.<br>위치 미션은 정답 주변 10 지도 픽셀까지 인정한 뒤 정확한 중심을 표시합니다. 그림은 상황 이해용이며 수치는 별도 도형을 기준으로 합니다.</p>')}

const prologue=[
['n','첫째 날 · 오후 2시 17분','섬의 지형을 조사하러 가던 수학 탐사선. 창밖의 햇빛이 사라지고, 검은 구름이 바다 위로 몰려왔다.'],
['jun','콰앙!','배 아래에서 무언가 부서지는 소리가 났다. “암초야! 모두 난간에서 떨어져!”'],

[['n','첫째 날 · 계곡 입구','나무 사이로 깊은 계곡이 나타났다. 다리 한가운데는 뚫려 있고, 아래에서는 거센 물소리가 울렸다.'],['jun','빠진 조각','“바닥만 덮으면 안 되겠어. 밑에서 받쳐 주던 삼각형 보강재가 빠졌어.” 준호가 안전한 쪽에서 남은 구조를 가리켰다.'],['ha','남아 있는 단서','“직각 표시가 있어. 길이와 각도 기록도 남아 있고! 모양이 비슷해 보여도 크기가 다르면 안 맞겠지?”'],['min','탐사대에게','“후보를 비교하자. 어떤 길이나 각이 같아서 합동인지, 이유를 말하고 골라 줘.”']],

[['jun','우리의 첫 번째 집','마지막 줄을 당기자 텐트가 팽팽해졌다. “완성! 생각보다 근사한데?”'],['min','모닥불 대신 작은 랜턴','“오늘 찾은 두 점, 비슷하면서도 달랐어. 하나는 꼭짓점까지, 하나는 변까지 같은 거리였지.”'],['n','어둠 속의 약속','작은 랜턴 아래에서 내일의 길을 확인했다. 멀리 산 쪽에서 자갈 구르는 소리가 났지만, 이 밤 캠프는 무사했다. “내일은 꼭 신호를 보내자.”']],
[['n','끼이익—','보강재를 설치하고 연결부를 조이자 문틀의 처짐이 줄었다. 걸려 있던 문이 천천히 열렸다.'],['jun','쓸 만한 물건들','“목재, 밧줄, 망치! 볼트와 금속 연결판도 있어. 이 정도면 신호탑을 수리할 수 있겠어.”'],['min','캠프로 돌아가자','“짐을 챙겨서 캠프에서 정리하자. 이제 정상으로 갈 준비가 됐어.” 그때까지는 모두 그렇게 생각했다.']],

const rockfall=[['n','둘째 날 · 캠프로 돌아오는 길','쿠르르릉—! 산 쪽에서 낮은 굉음이 울렸다. 흙먼지 사이로 바위들이 쏟아져 내렸다.'],['ha','모두 멈춰!','탐사대는 캠프 쪽에서 낙석이 잦아들기를 기다렸다. 어제 지나가려던 정상행 길은 바위 아래 완전히 묻혔다.'],['jun','남아 있는 텐트','“텐트는 무사해.” 경계에서 떨어진 곳에 세운 캠프에는 짐과 랜턴이 그대로 남아 있었다.'],['min','지도에 남은 길','“육로는 막혔지만… 여기 봐. 신호탑 반대편에 바다와 연결된 접근로가 있어.”'],['you','다음 행동을 정하자','길이 막혔다. 하지만 아직 지도와 도구가 있다.', ['지도의 해안 우회로를 살펴본다','창고에서 가져온 재료를 펼친다'],['해안을 따라가면 반대편에 닿을 수 있다. 준호가 목재와 밧줄을 가리켰다. “뗏목을 만들자!”','목재와 밧줄을 늘어놓자 생각이 떠올랐다. “뗏목을 만들면 지도의 해안 우회로로 갈 수 있어!”']],['n','새로운 계획','탐사대는 필요한 재료를 해변으로 옮겼다. 사라진 길 대신, 이제 물 위에 길을 만들 것이다.']];
const rescue=[['n','신호를 보낸 뒤','아무 반응도 없었다. 파도 소리만 들렸다. 민서는 송신기를 쥔 손에 힘을 주었다.'],['jun','조금만 더','“못 본 걸까?” 아무도 바로 대답하지 못했다. 그때 하린이 수평선을 가리켰다.'],['ha','저기, 움직이는 불빛!','멀리서 작은 불빛 하나가 깜빡였다. 한 번, 그리고 다시 한 번. 송신기에서 잡음이 터졌다.'],['radio','구조선 응답','“구조 신호 확인. 위치를 확인했습니다. 접근 중입니다.”'],['n','우리가 지나온 섬','탐사대는 서로를 바라보며 웃었다. 아래로는 복구한 다리와 초소, 무사한 캠프와 창고, 해변에 묶인 뗏목이 보였다.'],['you','마지막 탐사 기록','우리를 구한 것은 하나의 정답만이 아니었다. 서로의 생각을 듣고, 근거를 확인하고, 다시 시도한 모든 순간이었다. 구조선이 섬으로 다가왔다.']];
const style=document.createElement('style');style.textContent=`#storyDialog{max-width:1100px;width:94vw;padding:0;background:#091c1a;overflow:hidden}#storyDialog::backdrop{background:#020d0df2}.cinema{min-height:640px;max-height:88vh;overflow:auto;position:relative;display:flex;flex-direction:column;justify-content:end;background-size:cover;background-position:center}.cinema:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#071a19 3%,#071a19ed 38%,#071a1910 90%);pointer-events:none}.storyTop{position:relative;margin-bottom:auto;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.storyBody{position:relative;padding:24px 42px 34px}.speaker{display:inline-block;color:var(--gold);border-bottom:2px solid var(--gold);padding:8px 0;letter-spacing:1px;font-weight:800}.storyBody h2{font-size:clamp(22px,3vw,34px);margin:15px 0}.storyText{color:#f1f3e9;font-size:clamp(17px,2vw,22px);line-height:1.9;min-height:85px;margin:10px 0 18px;word-break:keep-all}.storyNav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:20px}.storyChoice{background:#16372eef;border-color:#c9b57c88}.reply{padding:14px 18px;background:#173d34;border-left:3px solid var(--gold);color:#dfefdf;line-height:1.8;border-radius:6px}.storyCount{font-size:12px;color:#c1cdbd}@media(max-width:600px){.cinema{min-height:560px}.storyBody{padding:18px 22px 26px}.storyTop{padding:14px}.storyText{min-height:120px}}`;document.head.appendChild(style);
const sd=document.createElement('dialog');sd.id='storyDialog';sd.setAttribute('aria-label','탐사대 이야기');document.body.appendChild(sd);
let tale=null,lastTale=null;
function playStory(lines,bg,label,finish){lastTale={lines,bg,label};tale={lines,bg,label,finish,index:0,answers:{}};if(!sd.open)sd.showModal();paintStory()}
function paintStory(){const t=tale,l=t.lines[t.index],who=cast[l[0]],answer=t.answers[t.index];sd.innerHTML=`<section class="cinema" style="background-image:url('${images[t.bg]}')"><div class="storyTop"><span class="eyebrow">${t.label}</span><button class="small" onclick="endStory()">이야기 건너뛰기</button></div><div class="storyBody"><span class="speaker">${who[1]} ${who[0]}</span><h2>${l[1]}</h2><p class="storyText">${l[2]}</p>${l[3]?'<div class="choices">'+l[3].map((v,i)=>`<button class="storyChoice" onclick="chooseStory(${i})" ${answer!==undefined?'disabled':''}>${v}</button>`).join('')+'</div>':''}${answer!==undefined?`<div class="reply" aria-live="polite">${l[4][answer]}</div>`:''}<div class="storyNav"><button class="small" onclick="tale.index--;paintStory()" ${t.index===0?'disabled':''}>← 이전</button><span class="storyCount">${t.index+1} / ${t.lines.length}</span><button id="storyNext" class="primary" onclick="nextStory()" ${l[3]&&answer===undefined?'disabled':''}>${t.index===t.lines.length-1?'계속하기 →':'다음 대화 →'}</button></div></div></section>`;sd.querySelector('#storyNext').focus()}
function chooseStory(i){tale.answers[tale.index]=i;paintStory()}
function nextStory(){if(tale.lines[tale.index][3]&&tale.answers[tale.index]===undefined)return;if(tale.index<tale.lines.length-1){tale.index++;paintStory()}else endStory()}
function endStory(){const f=tale?.finish;tale=null;sd.close();if(f)f()}
sd.addEventListener('cancel',e=>{e.preventDefault();endStory()});
const baseEnter=enter,baseEnding=ending;
enter=function(c){const first=state.chapter===-1;baseEnter(c);if(c<6)playStory(first&&c===0?[...prologue,...before[0]]:before[c],c,'STORY · '+titles[c],()=>{$('#puzzle h2')?.scrollIntoView({block:'nearest',behavior:'smooth'})})};
advance=function(){if(!solved)return;const c=state.chapter;playStory(after[c],c,'MISSION CLEAR · '+titles[c],()=>{if(c===3)playStory(rockfall,2,'STORY EVENT · 길이 사라졌다',()=>enter(4));else enter(c+1)})};
ending=function(){baseEnding();playStory(rescue,5,'ENDING · 구조 신호',()=>{})};
function replayStory(){if(!window.classroom?.getRole()||!validPlayer(state.player)||state.chapter<0)return;if(state.chapter>=0&&state.chapter<6)playStory(before[state.chapter],state.chapter,'STORY · '+titles[state.chapter],()=>{});else if(state.chapter===6)playStory(rescue,5,'ENDING · 구조 신호',()=>{});else playStory(prologue,6,'PROLOGUE · 폭풍이 지나간 자리',()=>{})}
const replay=document.createElement('button');replay.className='small';replay.textContent='이야기 다시 보기';replay.onclick=()=>replayStory();document.querySelector('.tools').prepend(replay);

const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validPlayer=p=>p&&Number.isInteger(p.classNo)&&p.classNo>=1&&p.classNo<=30&&typeof p.name==='string'&&p.name.trim().length>0&&p.name.length<=20&&['male','female'].includes(p.gender);
const archiveKey='island-math-results-v2';let history=[];try{history=JSON.parse(localStorage.getItem(archiveKey))||[];if(!Array.isArray(history))history=[]}catch(e){}

function allMapPoints(){return [...stations,...drawState.points]}

function toolMessage(){const n=drawState.pending.length;return {line:['연결할 첫 번째 점을 선택하세요.','두 번째 점을 선택하면 선분을 그립니다.'][n]||'',perp:'수직이등분할 선분을 클릭하세요. 지도 위 선분이나 그린 선 목록에서 선택할 수 있습니다.',angle:['각의 첫 번째 변 위의 점을 선택하세요.','각의 꼭짓점을 선택하세요. (두 번째 점이 꼭짓점입니다.)','다른 변 위의 점을 선택하세요.'][n]||'',intersection:n?'두 번째 선을 선택하세요. 지도 위 선이나 선 목록을 누르세요.':'교점을 만들 첫 번째 선을 선택하세요. 지도 위 선이나 선 목록을 누르세요.',select:'탐색할 교점 또는 관측소를 선택하세요. 세 관측소까지의 거리를 비교합니다.'}[drawState.tool]}

function watchPuzzle(){freshDrawing();$('.sceneBox').innerHTML='<div class="cartography"><div id="mapToolbar" class="mapToolbar"></div><div id="mapInstruction" class="mapInstruction" aria-live="polite"></div><div id="islandDrawing"></div><div class="mapFooter">지도 작도 · A/B/C는 관측소 위치입니다. 작도는 감점 없이 수정할 수 있습니다.</div></div>';$('#puzzle').innerHTML='<h2>지도를 펼치고 송신기를 찾아라</h2><div class="record">“비상 송신기는 세 관측소 A, B, C에서 같은 거리에 있는 곳에 보관하였다.”</div><p>선을 작도하고, 세 관측소까지 거리가 같은 교점을 찾으세요.</p><div class="btnrow"><button class="small" onclick="undoMap()">되돌리기</button><button class="small" onclick="clearMap()">작도 지우기</button></div><h3>점 선택</h3><div id="mapPointButtons" class="pointButtons"></div><h3>그린 선</h3><div id="mapLines" class="constructList"></div><div id="mapStats" class="mapStats" aria-live="polite">아직 탐색할 점을 선택하지 않았습니다.</div><button id="searchMap" class="primary next" onclick="searchWatch()">선택한 위치 탐색하기</button><details class="mapNotebook"><summary>작도 도구 사용법</summary><p>선 그리기: 두 점 → 선분<br>수직이등분선: 그린 선분 클릭 → 중점을 지나는 수선<br>각의 이등분선: 점 → 꼭짓점 → 점<br>교점: 그려진 두 선 선택<br>위치 선택: 관측소 또는 만든 교점 선택</p></details>';paintWatch()}
function mapLineGeometry(l){if(l.kind==='line')return {p:l.p,v:l.v,lo:0,hi:1};return {p:l.p,v:l.v,lo:l.kind==='angle'?0:-Infinity,hi:Infinity}}
function clippedMapLine(l){let {p,v,lo,hi}=mapLineGeometry(l);for(const [pos,vel,max] of [[p.x,v.x,1672],[p.y,v.y,941]]){if(Math.abs(vel)<1e-9){if(pos<0||pos>max)return null}else{let a=(0-pos)/vel,b=(max-pos)/vel;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b)}}return lo<=hi?{a:{x:p.x+v.x*lo,y:p.y+v.y*lo},b:{x:p.x+v.x*hi,y:p.y+v.y*hi}}:null}
function paintWatch(){if(!$('#islandDrawing'))return;if(!solved&&$('#feedback')?.classList.contains('bad')){$('#feedback').textContent='';$('#feedback').className=''}const ds=drawState,colors={line:'#174b60',perp:'#b64321',angle:'#653393'};$('#mapToolbar').innerHTML=[['line','╱ 선 그리기'],['angle','∠ 각의 이등분선'],['perp','⊥ 수직이등분선'],['intersection','× 교점'],['select','⌖ 위치 선택']].map(([t,label])=>`<button class="${ds.tool===t?'active':''}" ${solved?'disabled':''} onclick="setMapTool('${t}')" aria-pressed="${ds.tool===t}">${label}</button>`).join('');$('#mapInstruction').textContent=solved?'외심에서 송신기를 찾았습니다. 세 관측소까지의 거리가 같습니다.':toolMessage();let lines=ds.lines.map(l=>{let g=clippedMapLine(l);if(!g)return'';const picked=ds.pending.includes(l.id);return `<g><line class="mapConstruct" x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" stroke="#fff6dd" stroke-width="${picked?11:8}"/><line class="mapConstruct" x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" stroke="${picked?'#f09c22':colors[l.kind]}" stroke-width="5" ${l.kind==='line'?'':'stroke-dasharray="17 10"'}/><line class="constructHit" x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" onclick="chooseMapLine('${l.id}')"/><text x="${(g.a.x+g.b.x)/2+12}" y="${(g.a.y+g.b.y)/2-12}" pointer-events="none">${l.id}</text></g>`}).join('');const sel=mapPointById(ds.selected),rays=sel?stations.map(p=>`<line class="mapDistanceRay" x1="${sel.x}" y1="${sel.y}" x2="${p.x}" y2="${p.y}" stroke="#f8edac" stroke-width="4" stroke-dasharray="10 8" pointer-events="none"/>`).join(''):'';$('#islandDrawing').innerHTML=`<svg viewBox="0 0 1672 941" aria-label="섬 지도 작도판"><image href="${images[6]}" width="1672" height="941"/>${lines}${rays}${solved&&sel?`<circle class="mapSolutionCircle" cx="${sel.x}" cy="${sel.y}" r="${dist(sel,stations[0])}" fill="none" stroke="#227452" stroke-width="5" pointer-events="none"/>`:''}${allMapPoints().map(p=>`<g class="mapPoint" tabindex="0" role="button" aria-label="${p.id} 점 선택" onclick="chooseMapPoint('${p.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseMapPoint('${p.id}')}"><circle cx="${p.x}" cy="${p.y}" r="28" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="${p.id===ds.selected?14:11}" fill="${p.id===ds.selected?'#df7427':'#fff9e6'}" stroke="${ds.pending.includes(p.id)?'#ef6d20':'#223f2b'}" stroke-width="6"/><text x="${p.x+20}" y="${p.y-19}">${solved&&p.id===ds.selected?'O':p.id}</text></g>`).join('')}</svg>`;$('#mapPointButtons').innerHTML=allMapPoints().map(p=>`<button ${solved?'disabled':''} onclick="chooseMapPoint('${p.id}')">${p.id}</button>`).join('');$('#mapLines').innerHTML=ds.lines.length?ds.lines.map(l=>`<button ${solved?'disabled':''} class="${ds.pending.includes(l.id)?'picked':''}" onclick="chooseMapLine('${l.id}')">${l.id} · ${l.label}</button>`).join(''):'<span class="hint">아직 그린 선이 없습니다.</span>';$('#mapStats').textContent=sel?'선택: '+sel.id+' · A / B / C까지 '+stations.map(p=>(dist(sel,p)*500/180).toFixed(0)+' m').join(' / ')+' (지도 축척 기준 근삿값)':'도구를 골라 작도하세요. 선택한 점의 거리가 여기에 표시됩니다.'}
function chooseMapPoint(id){if(solved)return;const ds=drawState;if(ds.tool==='select'){ds.selected=id;paintWatch();return}if(ds.tool==='perp'){$('#mapInstruction').textContent='수직이등분선 도구에서는 점 대신 선분을 클릭하세요. 선분이 없다면 선 그리기로 먼저 두 점을 연결하세요.';return}if(ds.tool==='intersection'){$('#mapInstruction').textContent='교점 도구에서는 점 대신 그려진 선 두 개를 선택하세요.';return}if(ds.pending.includes(id)){$('#mapInstruction').textContent='서로 다른 점을 선택하세요.';return}ds.pending.push(id);const required=ds.tool==='angle'?3:2;if(ds.pending.length<required){paintWatch();return}const ps=ds.pending.map(mapPointById),ids=ds.pending.join(''),kind=ds.tool;let p,v,label;if(kind==='line'){p=ps[0];v={x:ps[1].x-p.x,y:ps[1].y-p.y};label=ids+' 선분'}else{p=ps[1];const a=dist(p,ps[0]),b=dist(p,ps[2]);v={x:(ps[0].x-p.x)/a+(ps[2].x-p.x)/b,y:(ps[0].y-p.y)/a+(ps[2].y-p.y)/b};label='∠'+ids+'의 이등분선'}if(Math.hypot(v.x,v.y)<1e-8){ds.pending=[];paintWatch();$('#mapInstruction').textContent='일직선으로 놓인 점으로는 이 각의 이등분선을 정할 수 없습니다.';return}drawSave();ds.lines.push({id:'L'+(++ds.serial),p:{x:p.x,y:p.y},v,kind,label});ds.pending=[];paintWatch()}
function chooseMapLine(id){if(solved)return;if(drawState.tool==='perp'){const segment=drawState.lines.find(l=>l.id===id);if(!segment||segment.kind!=='line'){$('#mapInstruction').textContent='수직이등분할 선분을 선택하세요. 이등분선은 선택할 수 없습니다.';return}drawSave();drawState.lines.push({id:'L'+(++drawState.serial),p:{x:segment.p.x+segment.v.x/2,y:segment.p.y+segment.v.y/2},v:{x:-segment.v.y,y:segment.v.x},kind:'perp',label:segment.label.replace(/ 선분$/,'')+'의 수직이등분선'});drawState.pending=[];paintWatch();return}if(drawState.tool!=='intersection'){$('#mapInstruction').textContent='수직이등분선 도구로 선분을 선택하거나, 교점 도구로 두 선을 선택하세요.';return}if(drawState.pending.includes(id))return;drawState.pending.push(id);if(drawState.pending.length===1){paintWatch();return}const [a,b]=drawState.pending.map(id=>mapLineGeometry(drawState.lines.find(l=>l.id===id))),cross=(u,v)=>u.x*v.y-u.y*v.x,den=cross(a.v,b.v),delta={x:b.p.x-a.p.x,y:b.p.y-a.p.y};let error='';if(Math.abs(den)<1e-8)error='두 선이 평행하거나 겹쳐서 하나의 교점이 정해지지 않습니다.';else{const t=cross(delta,b.v)/den,u=cross(delta,a.v)/den,p={x:a.p.x+t*a.v.x,y:a.p.y+t*a.v.y};if(t<a.lo-1e-8||t>a.hi+1e-8||u<b.lo-1e-8||u>b.hi+1e-8)error='선분이나 반직선의 그려진 부분에서는 만나지 않습니다.';else if(p.x<0||p.x>1672||p.y<0||p.y>941)error='교점이 지도 밖에 있습니다. 다른 선을 비교하세요.';else{drawSave();const existing=allMapPoints().find(q=>dist(p,q)<.1);if(existing)drawState.selected=existing.id;else{p.id='P'+(drawState.points.length+1);drawState.points.push(p);drawState.selected=p.id}}}drawState.pending=[];paintWatch();if(error)$('#mapInstruction').textContent=error;else $('#mapInstruction').textContent='교점을 표시했습니다. 거리를 비교하고 선택한 위치를 확인하세요.'}

tMark{position:absolute;top:-4px;left:50%;width:6px;height:21px;border-radius:4px;background:var(--gold);transform:translateX(-50%);transition:background .15s}\n#tiltMark.danger{background:var(--red);box-shadow:0 0 12px var(--red)}\n#warn{margin-top:8px;font-weight:900;font-size:19px;letter-spacing:1px;color:var(--red);opacity:0;transition:opacity .12s;text-shadow:0 2px 10px #000}\n#timeBar{height:7px;border-radius:6px;background:#ffffff1c;overflow:hidden;margin-top:6px}\n#timeFill{height:100%;width:0%;background:var(--green);transition:width .1s linear}\n.face{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:50% 18%;border:1px solid #ffffff33}\n.idBox{display:flex;gap:9px;align-items:center}\n\n#pad{position:absolute;right:16px;bottom:14px;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:7px;pointer-events:auto}\n#pad button{padding:0;font-size:20px;border-radius:12px;background:#12293580;border-color:#ffffff2e}\n#pad button:active{background:var(--gold);color:#253127}\nbody.touch #pad{display:grid}\n\n#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 40%,#0a1c26cc,#04090df2);backdrop-filter:blur(3px)}\n#screen.hidden{display:none}\n.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:#0f2530e8;border:1px solid #ffffff20;border-radius:18px;padding:26px 28px;text-align:center}\n.panel h1{font-size:clamp(24px,3.7vw,38px);margin:11px 0 6px;line-height:1.24;text-wrap:balance}\n.panel h1 span{color:var(--gold)}\n.panel p{color:var(--muted);line-height:1.75;margin:9px 0 16px;font-size:14.5px}\n.picks{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}\n.pick{width:150px;border:2px solid #ffffff22;border-radius:14px;overflow:hidden;background:#0d2029;cursor:pointer;transition:.18s;padding:0}\n.pick:hover{transform:translateY(-3px)}\n.pick.on{border-color:var(--gold);box-shadow:0 0 0 4px #f4c87833}\n.pick img{width:100%;height:172px;object-fit:cover;object-position:50% 16%;display:block}\n.pick .nm{padding:9px 6px;font-weight:800;font-size:14px}\n.pick .nm em{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}\n.keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}\n.key{background:#0d2029;border:1px solid #ffffff1f;border-radius:11px;padding:10px 14px;font-size:13px;line-height:1.6;color:var(--muted);min-width:150px}\n.key b{color:var(--ink);display:block;font-size:14px;margin-bottom:2px}\n.scoreBig{font-size:60px;font-weight:900;color:var(--gold);line-height:1;margin:6px 0}\n.rowStat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}\n.rowStat div{background:#0d2029;border:1px solid #ffffff1a;border-radius:11px;padding:9px 16px;font-size:13px;color:var(--muted)}\n.rowStat b{display:block;color:var(--ink);font-size:19px;margin-top:3px}\n.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}\n.note{font-size:12px;color:#7f9a92;margin-top:14px;line-height:1.7}\n.vest{background:#17303a;border:1px solid #f26a1b55;border-radius:12px;padding:13px 16px;margin:4px 0 16px;color:#ffd9b0;font-size:14.5px;line-height:1.75}\n.vest b{color:#ffb570}\n@media (max-width:620px){.panel{padding:20px 16px}.pick{width:128px}.pick img{height:146px}}\n@media (max-width:760px){\n  #hud{padding:10px 11px}\n  .hudTop{flex-wrap:wrap}\n  .card{padding:7px 10px}\n  .card b{font-size:18px}\n  #tiltWrap{order:3;flex:1 0 100%;max-width:100%}\n  #tiltBar{height:11px}\n  #warn{font-size:14px;margin-top:5px}\n  .face{width:32px;height:32px}\n  #pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);right:11px;bottom:11px}\n}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv id=\"stage\">\u003cdiv id=\"wrap\">\n  \u003ccanvas id=\"cv\">\u003c/canvas>\n\n  \u003cdiv id=\"hud\">\n    \u003cdiv class=\"hudTop\">\n      \u003cdiv class=\"card idBox\">\u003cimg id=\"hudFace\" class=\"face\" alt=\"\">\u003cdiv>\u003csmall>남은 시간\u003c/small>\u003cb id=\"hudTime\" style=\"font-size:20px\">15.0\u003c/b>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card\" id=\"tiltWrap\">\n        \u003csmall>배의 기울기 · SHIP TILT\u003c/small>\n        \u003cdiv id=\"tiltBar\">\u003cdiv id=\"tiltMark\">\u003c/div>\u003c/div>\n        \u003cdiv id=\"warn\">→ 오른쪽 방향키!\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\" style=\"text-align:right\">\u003csmall>점수\u003c/small>\u003cb id=\"hudScore\">25\u003c/b>\n        \u003cdiv id=\"timeBar\" style=\"width:96px\">\u003cdiv id=\"timeFill\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"pad\">\n    \u003cbutton data-k=\"ArrowLeft\" aria-label=\"왼쪽\">◀\u003c/button>\n    \u003cbutton data-k=\"ArrowUp\" aria-label=\"앞으로\">▲\u003c/button>\n    \u003cbutton data-k=\"ArrowRight\" aria-label=\"오른쪽\">▶\u003c/button>\n    \u003cbutton style=\"visibility:hidden\">\u003c/button>\n    \u003cbutton data-k=\"ArrowDown\" aria-label=\"뒤로\">▼\u003c/button>\n    \u003cbutton style=\"visibility:hidden\">\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"screen\">\u003cdiv class=\"panel\" id=\"panel\">\u003c/div>\u003c/div>\n\u003c/div>\u003c/div>\n\n\u003cscript>\n/* =========================================================\n   침몰하는 배에서 살아남아라\n   ========================================================= */\nconst PORTRAITS={};\n\nconst DUR = 15;\nconst LANES = [0.06, 0.28, 0.50, 0.72, 0.94];\nconst SLIDE_P = 2.00, MOVE_P = 2.75, FRIC_P = 2.20;\nconst SLIDE_O = 2.90, FRIC_O = 0.95;\nconst ZSPEED = 0.78, HIT_Z = 0.085;\n\n/* 원화에서 뽑은 폭풍 팔레트 */\nconst C = {\n  skyHi:'#4a5f7e', skyLo:'#22304a', cloud:'#1b2740', cloud2:'#243b55',\n  island:'#54708f', islandDark:'#32445e',\n  seaFar:'#27405c', seaMid:'#1a2f47', seaNear:'#0d1e30',\n  foam:'#b8cbdb', foamHi:'#e3eef6',\n  plank:'#4a3e36', plankAlt:'#574840', sheen:'#a9c0d2',\n  steel:'#8b9bab', steelLo:'#5a6b7d', steelHi:'#c2cedb',\n  ringRed:'#c0492f', ringWhite:'#e6e9ec',\n  wood:'#6b5a4a', woodLo:'#493d32', woodHi:'#8d7a65',\n  vest:'#f0691b', vestLo:'#c04d0c', vestHi:'#ffb163',\n  jacket:'#2c7f80', jacketLo:'#1d5c5f',\n  tee:'#efe8dc', shorts:'#3a4048', skin:'#f3cba6', skinLo:'#d9a87f',\n  boot:'#6b4b33', sock:'#eef1f3'\n};\n\nconst cv = document.getElementById('cv'), ctx = cv.getContext('2d');\nconst $ = s => document.querySelector(s);\nlet W = 1180, H = 700;\n\nfunction resize(){\n  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);\n  W = r.width; H = r.height;\n  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n}\naddEventListener('resize', resize);\n\n/* ---------------- 입력 ---------------- */\nconst keys = {};\nconst MAP = {ArrowLeft:'L', KeyA:'L', ArrowRight:'R', KeyD:'R', ArrowUp:'U', KeyW:'U', ArrowDown:'D', KeyS:'D'};\naddEventListener('keydown', e => { if(MAP[e.code]){ keys[MAP[e.code]] = 1; e.preventDefault(); } });\naddEventListener('keyup',   e => { if(MAP[e.code]){ keys[MAP[e.code]] = 0; e.preventDefault(); } });\naddEventListener('blur', () => { for(const k in keys) keys[k] = 0; });\ndocument.querySelectorAll('#pad button[data-k]').forEach(b => {\n  const k = MAP[b.dataset.k];\n  const on = e => { e.preventDefault(); keys[k] = 1; };\n  const off = e => { e.preventDefault(); keys[k] = 0; };\n  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);\n  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);\n});\nif(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');\n\n/* ---------------- 상태 ---------------- */\nlet G = null, gender = 'male', raf = 0, last = 0;\n\nfunction newGame(){\n  return {\n    phase:'play',                 // play | falling | wave | done\n    t:0, elapsed:0,\n    tilt:0, seed:Math.random()*100,\n    px:0, pz:0.5, pvx:0, lean:0, step:0,\n    obs:[], spawnT:0,\n    flash:0, bolt:null, shake:0, fall:null, wave:null, cause:'',\n    rain:Array.from({length:190}, () => ({x:Math.random(), y:Math.random(), s:0.6 + Math.random()*0.9}))\n  };\n}\n\nfunction spawn(g){\n  const lane = LANES[(Math.random() * LANES.length) | 0];\n  const side = g.px > 0 ? -1 : 1;\n  const kind = Math.random() \u003c 0.5 ? 'barrel' : (Math.random() \u003c 0.6 ? 'crate' : 'drum');\n  g.obs.push({x:side * 0.86, z:lane, vx:-side * 0.18, r:kind === 'crate' ? 0.115 : 0.105, kind, spin:Math.random() * 6});\n}\n\n/* ---------------- 물리 ---------------- */\nfunction step(g, dt){\n  g.t += dt;\n  if(g.phase === 'play') g.elapsed = Math.min(DUR, g.elapsed + dt);\n  const prog = g.elapsed / DUR;\n\n  const amp = 0.46 + 0.46 * prog;\n  const wv = Math.sin(g.t * 0.86 + g.seed) * 0.62 + Math.sin(g.t * 1.57 + g.seed * 2.1) * 0.30\n           + Math.sin(g.t * 2.45 + g.seed * 0.7) * 0.14;\n  g.tilt += (Math.max(-1, Math.min(1, wv * amp)) - g.tilt) * Math.min(1, dt * 2.6);\n\n  if(Math.random() \u003c dt * 0.30){ g.flash = 1; g.bolt = makeBolt(); }\n  g.flash = Math.max(0, g.flash - dt * 2.4);\n  g.shake = Math.max(0, g.shake - dt * 3);\n\n  if(g.phase === 'falling'){ stepFall(g, dt); return; }\n  if(g.phase === 'wave'){ stepWave(g, dt); return; }\n  if(g.phase !== 'play') return;\n\n  /* 기울기에 미끄러지고, 반대 방향키로 버틴다 */\n  g.pvx += g.tilt * SLIDE_P * dt;\n  if(keys.L) g.pvx -= MOVE_P * dt;\n  if(keys.R) g.pvx += MOVE_P * dt;\n  g.pvx -= g.pvx * FRIC_P * dt;\n  g.px  += g.pvx * dt;\n\n  if(keys.U) g.pz -= ZSPEED * dt;\n  if(keys.D) g.pz += ZSPEED * dt;\n  g.pz = Math.max(0.02, Math.min(0.98, g.pz));\n  g.lean += ((g.tilt * 0.26 + g.pvx * 0.14) - g.lean) * Math.min(1, dt * 8);\n  g.step += Math.abs(g.pvx) * dt * 7 + ((keys.U || keys.D) ? dt * 5 : 0);\n\n  if(Math.abs(g.px) > 1){ fallOver(g, g.px > 0 ? 1 : -1, '난간 밖으로 미끄러졌다'); return; }\n\n  for(const o of g.obs){\n    o.vx += g.tilt * SLIDE_O * dt;\n    o.vx -= o.vx * FRIC_O * dt;\n    o.x  += o.vx * dt;\n    o.spin += o.vx * dt * 7;\n    const lim = 0.95 - o.r;\n    if(o.x \u003c -lim){ o.x = -lim; o.vx = Math.abs(o.vx) * 0.5; }\n    if(o.x >  lim){ o.x =  lim; o.vx = -Math.abs(o.vx) * 0.5; }\n  }\n\n  const want = Math.min(7, 3 + Math.floor(prog * 5.4));\n  g.spawnT -= dt;\n  if(g.obs.length \u003c want && g.spawnT \u003c= 0){ spawn(g); g.spawnT = 1.1; }\n\n  for(const o of g.obs){\n    if(Math.abs(g.pz - o.z) \u003c HIT_Z && Math.abs(g.px - o.x) \u003c o.r + 0.065){\n      fallOver(g, o.vx >= 0 ? 1 : -1, '굴러온 짐에 부딪혔다'); return;\n    }\n  }\n\n  if(g.elapsed >= DUR) startWave(g);\n}\n\n/* 난간 밖 / 짐 충돌 → 바다로 */\nfunction fallOver(g, dir, cause){\n  g.phase = 'falling'; g.cause = cause; g.shake = 1;\n  g.fall = {x:g.px, z:g.pz, dir, vy:-150, y:0, rot:0, T:0, splash:0};\n}\nfunction stepFall(g, dt){\n  const f = g.fall; f.T += dt;\n  f.x = Math.max(-1.12, Math.min(1.12, f.x + f.dir * 0.95 * dt));\n  f.vy += 760 * dt; f.y += f.vy * dt;\n  f.rot += f.dir * 4.2 * dt;\n  if(f.y > 40 && !f.splash) f.splash = 0.001;\n  if(f.splash) f.splash += dt;\n  if(f.T > 1.25){ startWave(g); }\n}\n\n/* 15초 생존 → 거대한 파도가 갑판을 덮치고 배가 침몰한다 */\nfunction startWave(g){\n  g.phase = 'wave'; g.shake = 1; g.flash = 1; g.bolt = makeBolt();\n  g.wave = {T:g.fall ? 0.7 : 0, sink:0, white:0};\n}\nfunction stepWave(g, dt){\n  const w = g.wave; w.T += dt;\n  g.shake = Math.max(g.shake, Math.min(1, w.T * 0.9));\n  g.tilt += (Math.sin(w.T * 3.1) * 0.9 - g.tilt) * Math.min(1, dt * 3);\n  if(w.T > 1.5) w.sink = Math.min(1, w.sink + dt * 0.85);\n  if(w.T > 2.3) w.white = Math.min(1, w.white + dt * 1.5);\n  if(w.T > 3.3){ g.phase = 'done'; finish(!g.fall); }\n}\n\nfunction makeBolt(){\n  const x = W * (0.25 + Math.random() * 0.5), pts = [[x, -10]];\n  let cx = x, cy = -10;\n  while(cy \u003c H * 0.33){ cy += 14 + Math.random() * 26; cx += (Math.random() - 0.5) * 52; pts.push([cx, cy]); }\n  return pts;\n}\n\n/* ---------------- 투영 ---------------- */\nfunction proj(x, z){\n  const zz = Math.pow(Math.max(0, Math.min(1, z)), 0.86);\n  const hw = W * 0.185 + W * 0.295 * zz;\n  const y  = H * 0.505 + (H * 0.955 - H * 0.505) * zz;\n  return {sx:W / 2 + x * hw, sy:y, s:0.46 + 0.56 * zz, hw};\n}\n\n/* =========================================================\n   그리기\n   ========================================================= */\nfunction draw(g){\n  ctx.clearRect(0, 0, W, H);\n  const tilt = g.tilt;\n  const sink = g.wave ? g.wave.sink : 0;\n  const sh = g.shake * Math.sin(g.t * 47) * 6;\n\n  drawSkySea(g, tilt, sink);\n  if(g.phase === 'wave') drawBigWave(g, 'back');\n\n  const roll = () => {\n    ctx.translate(W / 2 + sh, H * 1.75);\n    ctx.rotate(tilt * 0.115);\n    ctx.translate(-W / 2, -H * 1.75 + sink * H * 0.30);\n  };\n\n  ctx.save(); roll(); drawShip(g); ctx.restore();\n\n  ctx.save(); roll();\n  const items = g.obs.map(o => ({z:o.z, o:o}));\n  if(g.phase === 'play' || g.phase === 'wave') items.push({z:g.pz, p:1});\n  else if(g.fall) items.push({z:g.fall.z, f:1});\n  items.sort((a, b) => a.z - b.z);\n  for(const it of items){\n    if(it.o) drawCargo(g, it.o);\n    else if(it.p) drawPlayer(g, g.px, g.pz, g.lean, 0, 0);\n    else drawPlayer(g, g.fall.x, g.fall.z, g.fall.rot, g.fall.y, 1);\n  }\n  ctx.restore();\n\n  if(g.fall && g.fall.splash) drawSplash(g);\n  if(g.phase === 'wave') drawBigWave(g, 'front');\n\n  drawRain(g, tilt);\n\n  if(g.flash > 0.02){\n    ctx.fillStyle = 'rgba(206,226,248,' + (g.flash * 0.26) + ')';\n    ctx.fillRect(0, 0, W, H);\n  }\n  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.95);\n  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.58)');\n  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);\n\n  if(g.wave && g.wave.white > 0){\n    ctx.fillStyle = 'rgba(226,238,247,' + g.wave.white + ')';\n    ctx.fillRect(0, 0, W, H);\n  }\n}\n\n/* ---- 하늘 · 번개 · 섬 · 바다 ---- */\nfunction drawSkySea(g, tilt, sink){\n  const HOR = H * (0.355 + sink * 0.20);\n  ctx.save();\n  ctx.translate(W / 2, HOR); ctx.rotate(-tilt * 0.055); ctx.translate(-W / 2, -HOR);\n\n  const sky = ctx.createLinearGradient(0, -H * 0.4, 0, HOR);\n  sky.addColorStop(0, '#141d30'); sky.addColorStop(0.5, C.skyLo); sky.addColorStop(1, C.skyHi);\n  ctx.fillStyle = sky; ctx.fillRect(-W, -H, W * 3, H + HOR);\n\n  for(let L = 0; L \u003c 3; L++){\n    ctx.fillStyle = L === 0 ? C.cloud : (L === 1 ? C.cloud2 : '#2e4763');\n    ctx.globalAlpha = 0.62 - L * 0.13;\n    ctx.beginPath();\n    const base = HOR - 118 + L * 42, sp = 210 + L * 70;\n    ctx.moveTo(-W, base - 120);\n    for(let x = -W; x \u003c= W * 2; x += 26){\n      const y = base - Math.abs(Math.sin(x / sp + L * 1.7 + g.t * 0.05)) * (44 - L * 9)\n                     - Math.sin(x / (sp * 0.4) + L) * 9;\n      ctx.lineTo(x, y);\n    }\n    ctx.lineTo(W * 2, base + 60); ctx.lineTo(-W, base + 60); ctx.closePath(); ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  if(g.flash > 0.25 && g.bolt){\n    ctx.save();\n    ctx.globalAlpha = Math.min(1, g.flash * 1.4);\n    ctx.shadowColor = '#cfe4ff'; ctx.shadowBlur = 26;\n    ctx.strokeStyle = '#eef6ff'; ctx.lineWidth = 3.2; ctx.lineJoin = 'round';\n    ctx.beginPath(); ctx.moveTo(g.bolt[0][0], g.bolt[0][1]);\n    for(const p of g.bolt) ctx.lineTo(p[0], p[1]);\n    ctx.stroke();\n    ctx.lineWidth = 1.2; ctx.strokeStyle = '#ffffff'; ctx.stroke();\n    ctx.restore();\n  }\n\n  // 목적지 섬의 실루엣\n  ctx.save();\n  ctx.globalAlpha = 1;\n  const ix = W * 0.30, iw = W * 0.24;\n  // 비에 젖은 대기 halo\n  ctx.fillStyle = 'rgba(126,157,188,0.10)';\n  ctx.beginPath(); ctx.ellipse(ix, HOR - H * 0.02, iw * 1.0, H * 0.055, 0, 0, 7); ctx.fill();\n  ctx.fillStyle = C.island;\n  ctx.beginPath(); ctx.moveTo(ix - iw, HOR + 2);\n  const peaks = [[-0.72,0.20],[-0.50,0.52],[-0.30,0.34],[-0.08,0.78],[0.10,0.46],[0.34,0.66],[0.58,0.28],[0.80,0.12]];\n  for(const pk of peaks) ctx.lineTo(ix + iw * pk[0], HOR + 2 - H * 0.135 * pk[1]);\n  ctx.lineTo(ix + iw, HOR + 2); ctx.closePath(); ctx.fill();\n  ctx.strokeStyle = 'rgba(190,214,236,0.45)'; ctx.lineWidth = 1.6; ctx.stroke();\n  ctx.fillStyle = C.islandDark; ctx.globalAlpha = 0.70;\n  ctx.beginPath(); ctx.moveTo(ix - iw * 0.1, HOR + 2);\n  ctx.lineTo(ix - iw * 0.08, HOR - H * 0.09); ctx.lineTo(ix + iw * 0.34, HOR - H * 0.075);\n  ctx.lineTo(ix + iw, HOR + 2); ctx.closePath(); ctx.fill();\n  ctx.restore();\n\n  const sea = ctx.createLinearGradient(0, HOR, 0, H * 1.35);\n  sea.addColorStop(0, '#16283d'); sea.addColorStop(0.06, C.seaFar);\n  sea.addColorStop(0.34, C.seaMid); sea.addColorStop(1, C.seaNear);\n  ctx.fillStyle = sea; ctx.fillRect(-W, HOR, W * 3, H * 1.7);\n\n  for(let i = 0; i \u003c 11; i++){\n    const f = i / 11, y = HOR + Math.pow(f, 1.6) * H * 0.62 + 6;\n    const amp = 5 + i * 5.2, spd = 0.7 + i * 0.16;\n    const crest = x => y + Math.sin(x * 0.0085 + g.t * spd + i * 1.3) * amp\n                        + Math.sin(x * 0.021 + g.t * spd * 1.6) * amp * 0.35;\n    ctx.beginPath();\n    for(let x = -W; x \u003c= W * 2; x += 18){ x === -W ? ctx.moveTo(x, crest(x)) : ctx.lineTo(x, crest(x)); }\n    ctx.lineTo(W * 2, H * 1.6); ctx.lineTo(-W, H * 1.6); ctx.closePath();\n    ctx.fillStyle = 'rgba(16,34,52,' + (0.16 + f * 0.10) + ')'; ctx.fill();\n\n    ctx.beginPath();\n    for(let x = -W; x \u003c= W * 2; x += 18){ x === -W ? ctx.moveTo(x, crest(x)) : ctx.lineTo(x, crest(x)); }\n    ctx.strokeStyle = 'rgba(200,222,238,' + (0.11 + f * 0.30) + ')';\n    ctx.lineWidth = 1.2 + i * 0.40; ctx.stroke();\n    // 흰 물마루\n    if(i > 5){\n      ctx.fillStyle = 'rgba(236,246,252,' + (f * 0.70) + ')';\n      for(let k = 0; k \u003c 4; k++){\n        const x = ((k * 397 + i * 151 + g.t * (20 + i * 7)) % (W * 1.5)) - W * 0.25;\n        const y = crest(x), wsp = 7 + i * 1.8;\n        ctx.beginPath(); ctx.moveTo(x - wsp, y + 1);\n        ctx.quadraticCurveTo(x, y - 3.5 - i * 0.6, x + wsp, y + 1);\n        ctx.quadraticCurveTo(x, y + 2.5, x - wsp, y + 1);\n        ctx.fill();\n      }\n    }\n  }\n  ctx.restore();\n}\n\n/* ---- 원화의 배: 젖은 갑판 + 철제 난간 + 구명부환 ---- */\nfunction drawShip(g){\n  const a = proj(-1, 0), b = proj(1, 0), c = proj(1, 1), d = proj(-1, 1);\n\n  ctx.fillStyle = '#1a222c';\n  ctx.beginPath();\n  ctx.moveTo(a.sx - 16, a.sy - 4); ctx.lineTo(b.sx + 16, b.sy - 4);\n  ctx.lineTo(c.sx + W * 0.55, H * 2.2); ctx.lineTo(d.sx - W * 0.55, H * 2.2);\n  ctx.closePath(); ctx.fill();\n\n  const N = 20;\n  for(let i = 0; i \u003c N; i++){\n    const x0 = -1 + (2 * i) / N, x1 = -1 + (2 * (i + 1)) / N;\n    const p0 = proj(x0, 0), p1 = proj(x1, 0), p2 = proj(x1, 1), p3 = proj(x0, 1);\n    ctx.fillStyle = i % 2 ? C.plank : C.plankAlt;\n    ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy);\n    ctx.lineTo(p2.sx, p2.sy); ctx.lineTo(p3.sx, p3.sy); ctx.closePath(); ctx.fill();\n    ctx.strokeStyle = 'rgba(18,22,29,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();\n  }\n\n  ctx.save(); deckPath(); ctx.clip();\n\n  const wet = ctx.createLinearGradient(0, proj(0, 0).sy, 0, proj(0, 1).sy);\n  wet.addColorStop(0, 'rgba(12,20,30,0.70)'); wet.addColorStop(0.45, 'rgba(12,20,30,0.10)');\n  wet.addColorStop(1, 'rgba(12,20,30,0.48)');\n  ctx.fillStyle = wet; ctx.fillRect(0, 0, W, H);\n\n  // 조타실 불빛이 젖은 갑판에 비친다\n  const rf = ctx.createLinearGradient(0, proj(0, 0).sy, 0, proj(0, 0.75).sy);\n  rf.addColorStop(0, 'rgba(244,200,120,0.22)'); rf.addColorStop(1, 'rgba(244,200,120,0)');\n  ctx.fillStyle = rf;\n  ctx.fillRect(proj(0, 0).sx - 70, proj(0, 0).sy, 140, proj(0, 0.75).sy - proj(0, 0).sy);\n\n  ctx.globalAlpha = 0.30; ctx.fillStyle = C.sheen;\n  for(let i = 0; i \u003c 9; i++){\n    const z = (i + 0.25) / 9, p = proj(0, z);\n    ctx.fillRect(p.sx - p.hw, p.sy + Math.sin(g.t * 2.1 + i) * 4, p.hw * 2, 2.2 + p.s * 1.6);\n  }\n  ctx.globalAlpha = 0.13; ctx.fillStyle = '#d6e6f2';\n  for(let i = 0; i \u003c 26; i++){\n    const z = ((i * 0.041 + 0.02) % 1), p = proj(Math.sin(i * 1.9) * 0.85, z);\n    ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 34 * p.s, 3.4 * p.s, 0, 0, 7); ctx.fill();\n  }\n\n  ctx.globalAlpha = 0.20; ctx.fillStyle = C.foam;\n  for(let i = 0; i \u003c 40; i++){\n    const z = ((i * 0.083 + g.t * 0.22) % 1);\n    const p = proj(Math.sin(i * 2.7) * 0.9 + g.tilt * 0.35, z);\n    ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 22 * p.s, 3 * p.s, g.tilt * 0.2, 0, 7); ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  if(Math.abs(g.tilt) > 0.18 && g.phase === 'play'){\n    const dir = Math.sign(g.tilt), al = Math.min(0.5, (Math.abs(g.tilt) - 0.18) * 1.5);\n    ctx.save(); ctx.strokeStyle = C.vestHi; ctx.lineWidth = 5; ctx.lineJoin = 'round';\n    for(let i = 0; i \u003c 3; i++){\n      const zz = 0.30 + i * 0.22, p = proj(dir * (0.42 + 0.12 * i), zz);\n      const k = 15 * p.s, ph = (g.t * 2.4 + i) % 1;\n      ctx.globalAlpha = al * (1 - ph * 0.6);\n      ctx.beginPath(); ctx.moveTo(p.sx - dir * k, p.sy - k);\n      ctx.lineTo(p.sx + dir * k, p.sy); ctx.lineTo(p.sx - dir * k, p.sy + k); ctx.stroke();\n    }\n    ctx.restore();\n  }\n\n  if(g.phase === 'play'){\n    const p = proj(0, g.pz);\n    ctx.fillStyle = 'rgba(244,200,120,0.12)';\n    ctx.fillRect(p.sx - p.hw, p.sy - 5 * p.s, p.hw * 2, 10 * p.s);\n  }\n  ctx.restore();\n\n  ctx.strokeStyle = 'rgba(16,20,26,0.45)'; ctx.lineWidth = 2;\n  for(let i = 1; i \u003c 8; i++){\n    const p = proj(0, i / 8);\n    ctx.beginPath(); ctx.moveTo(p.sx - p.hw, p.sy); ctx.lineTo(p.sx + p.hw, p.sy); ctx.stroke();\n  }\n\n  drawRails(g);\n  drawFittings(g);\n}\n\nfunction drawRails(g){\n  for(const side of [-1, 1]){\n    const t0 = proj(side, 0), t1 = proj(side, 1);\n    ctx.beginPath();\n    ctx.moveTo(t0.sx, t0.sy); ctx.lineTo(t1.sx, t1.sy);\n    ctx.lineTo(t1.sx + side * 26, t1.sy + 26); ctx.lineTo(t0.sx + side * 9, t0.sy + 7);\n    ctx.closePath(); ctx.fillStyle = '#2b3542'; ctx.fill();\n\n    for(let i = 0; i \u003c= 9; i++){\n      const z = i / 9, p = proj(side, z), hgt = 46 * p.s;\n      const lg = ctx.createLinearGradient(p.sx - 3, 0, p.sx + 3, 0);\n      lg.addColorStop(0, C.steelLo); lg.addColorStop(0.45, C.steelHi); lg.addColorStop(1, C.steelLo);\n      ctx.fillStyle = lg;\n      ctx.fillRect(p.sx - 2.6 * p.s, p.sy - hgt, 5.2 * p.s, hgt);\n    }\n    for(const h of [46, 31, 17]){\n      const p0 = proj(side, 0), p1 = proj(side, 1);\n      ctx.strokeStyle = h === 46 ? C.steelHi : C.steel;\n      ctx.lineWidth = (h === 46 ? 5 : 3.2);\n      ctx.beginPath();\n      ctx.moveTo(p0.sx, p0.sy - h * p0.s); ctx.lineTo(p1.sx, p1.sy - h * p1.s); ctx.stroke();\n      ctx.strokeStyle = 'rgba(20,28,38,0.45)'; ctx.lineWidth = 1.2;\n      ctx.beginPath();\n      ctx.moveTo(p0.sx, p0.sy - h * p0.s + 2); ctx.lineTo(p1.sx, p1.sy - h * p1.s + 2); ctx.stroke();\n    }\n\n    ctx.fillStyle = '#39434f';\n    for(let i = 0; i \u003c 5; i++){\n      const z = 0.12 + i * 0.19, p = proj(side, z);\n      for(let k = 0; k \u003c 6; k++){\n        const yy = p.sy - 40 * p.s + k * 7 * p.s + Math.sin(g.t * 2 + i) * 1.5;\n        ctx.beginPath(); ctx.ellipse(p.sx + side * 5 * p.s, yy, 2.8 * p.s, 3.6 * p.s, 0, 0, 7); ctx.fill();\n      }\n    }\n\n    const amt = Math.max(0, g.tilt * side);\n    if(amt > 0.12){\n      ctx.save(); ctx.globalAlpha = Math.min(0.6, (amt - 0.12) * 1.7);\n      ctx.fillStyle = C.foamHi;\n      for(let i = 0; i \u003c 30; i++){\n        const z = ((i * 0.137 + g.t * 0.4) % 1), p = proj(side * 0.99, z);\n        const r = (2.5 + ((i * 7) % 5)) * p.s;\n        ctx.beginPath();\n        ctx.arc(p.sx - side * ((i * 17 + g.t * 110) % 80), p.sy - 30 * p.s - ((i * 11 + g.t * 70) % 46), r, 0, 7);\n        ctx.fill();\n      }\n      ctx.restore();\n    }\n  }\n}\n\n/* 원화 속 소품: 구명부환 · 계선주 · 나무 궤짝 · 밧줄 · 조타실 */\nfunction drawFittings(g){\n  const lr = proj(-0.99, 0.34), s = lr.s;\n  ctx.save(); ctx.translate(lr.sx, lr.sy - 42 * s); ctx.scale(s, s);\n  ctx.lineWidth = 9; ctx.strokeStyle = C.ringRed;\n  ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.stroke();\n  ctx.strokeStyle = C.ringWhite;\n  for(const a0 of [0.35, Math.PI + 0.35]){ ctx.beginPath(); ctx.arc(0, 0, 19, a0, a0 + 0.9); ctx.stroke(); }\n  ctx.strokeStyle = '#1d2530'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.arc(0, 0, 23.5, 0, 7); ctx.stroke();\n  ctx.beginPath(); ctx.arc(0, 0, 14.5, 0, 7); ctx.stroke();\n  ctx.restore();\n\n  for(const bt of [[-0.62, 0.20], [0.66, 0.16]]){\n    const p = proj(bt[0], bt[1]), k = p.s;\n    ctx.fillStyle = '#20293a';\n    ctx.fillRect(p.sx - 10 * k, p.sy - 38 * k, 20 * k, 38 * k);\n    ctx.beginPath(); ctx.ellipse(p.sx, p.sy - 38 * k, 16 * k, 6 * k, 0, 0, 7); ctx.fill();\n    ctx.fillStyle = '#4a5a70';\n    ctx.beginPath(); ctx.ellipse(p.sx, p.sy - 39 * k, 16 * k, 5.5 * k, 0, Math.PI, 0); ctx.fill();\n    ctx.fillStyle = '#2d3a4d'; ctx.fillRect(p.sx - 13 * k, p.sy - 6 * k, 26 * k, 6 * k);\n  }\n\n  const lk = proj(-0.80, 0.06), k = lk.s;\n  ctx.fillStyle = C.woodLo; ctx.fillRect(lk.sx - 30 * k, lk.sy - 34 * k, 60 * k, 34 * k);\n  ctx.fillStyle = C.wood;   ctx.fillRect(lk.sx - 30 * k, lk.sy - 40 * k, 60 * k, 8 * k);\n  ctx.strokeStyle = '#2a333f'; ctx.lineWidth = 2 * k;\n  ctx.strokeRect(lk.sx - 30 * k, lk.sy - 34 * k, 60 * k, 34 * k);\n\n  const rp = proj(0.82, 0.10), r2 = rp.s;\n  ctx.strokeStyle = C.woodHi; ctx.lineWidth = 4 * r2;\n  for(let i = 0; i \u003c 4; i++){\n    ctx.beginPath();\n    ctx.ellipse(rp.sx, rp.sy - 3 * r2 - i * 3 * r2, (20 - i * 3.5) * r2, (7 - i * 1.2) * r2, 0, 0, 7);\n    ctx.stroke();\n  }\n\n  const bow = proj(0, 0), bw = W * 0.145, bh = 104;\n  // 돛대와 스테이\n  ctx.strokeStyle = 'rgba(180,198,216,0.45)'; ctx.lineWidth = 1.6;\n  ctx.beginPath(); ctx.moveTo(bow.sx, bow.sy - bh - 96); ctx.lineTo(bow.sx - bw * 1.5, bow.sy - 6); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(bow.sx, bow.sy - bh - 96); ctx.lineTo(bow.sx + bw * 1.5, bow.sy - 6); ctx.stroke();\n  ctx.fillStyle = '#4a5a70'; ctx.fillRect(bow.sx - 4, bow.sy - bh - 96, 8, 100);\n  ctx.fillStyle = '#c0492f'; ctx.beginPath(); ctx.arc(bow.sx, bow.sy - bh - 98, 5.5, 0, 7); ctx.fill();\n\n  // 조타실\n  ctx.fillStyle = '#e4e9ee'; ctx.fillRect(bow.sx - bw, bow.sy - bh, bw * 2, bh - 6);   // 흰 도장\n  const shd = ctx.createLinearGradient(bow.sx - bw, 0, bow.sx + bw, 0);\n  shd.addColorStop(0, 'rgba(18,28,40,0.62)'); shd.addColorStop(0.45, 'rgba(18,28,40,0.18)');\n  shd.addColorStop(1, 'rgba(18,28,40,0.58)');\n  ctx.fillStyle = shd; ctx.fillRect(bow.sx - bw, bow.sy - bh, bw * 2, bh - 6);\n  ctx.fillStyle = '#39465c'; ctx.fillRect(bow.sx - bw - 7, bow.sy - bh - 9, bw * 2 + 14, 11);  // 지붕\n  ctx.fillStyle = '#121a24'; ctx.fillRect(bow.sx - bw + 12, bow.sy - bh + 16, bw * 2 - 24, 34); // 창\n  const gl = ctx.createLinearGradient(bow.sx - bw, 0, bow.sx + bw, 0);\n  gl.addColorStop(0, 'rgba(244,200,120,0.62)'); gl.addColorStop(0.5, 'rgba(244,200,120,0.24)');\n  gl.addColorStop(1, 'rgba(244,200,120,0.58)');\n  ctx.fillStyle = gl; ctx.fillRect(bow.sx - bw + 15, bow.sy - bh + 19, bw * 2 - 30, 28);\n  ctx.fillStyle = '#20293a';\n  for(let i = 1; i \u003c 4; i++) ctx.fillRect(bow.sx - bw + 12 + (bw * 2 - 24) * i / 4 - 2, bow.sy - bh + 16, 4, 34);\n  ctx.fillStyle = '#20293a'; ctx.fillRect(bow.sx - 13, bow.sy - bh + 58, 26, bh - 64);        // 출입문\n  ctx.fillStyle = '#8b9bab'; ctx.fillRect(bow.sx + 7, bow.sy - bh + 74, 3, 7);\n  ctx.fillStyle = 'rgba(12,20,30,0.5)'; ctx.fillRect(bow.sx - bw, bow.sy - 8, bw * 2, 6);     // 바닥 그림자\n}\n\nfunction deckPath(){\n  const a = proj(-1, 0), b = proj(1, 0), c = proj(1, 1), d = proj(-1, 1);\n  ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy);\n  ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.closePath();\n}\n\nfunction shadow(sx, sy, w, h){\n  ctx.fillStyle = 'rgba(6,12,20,0.42)';\n  ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, 7); ctx.fill();\n}\n\nfunction drawCargo(g, o){\n  const p = proj(o.x, o.z), s = p.s, w = 54 * s, h = 60 * s;\n  shadow(p.sx, p.sy, w * 0.60, 7 * s);\n  ctx.save(); ctx.translate(p.sx, p.sy); ctx.rotate(g.tilt * 0.10);\n  if(o.kind === 'crate'){\n    ctx.fillStyle = C.wood; ctx.fillRect(-w / 2, -h, w, h);\n    ctx.fillStyle = C.woodHi; ctx.fillRect(-w / 2, -h, w, 7 * s);\n    ctx.strokeStyle = C.woodLo; ctx.lineWidth = 4 * s;\n    ctx.beginPath(); ctx.moveTo(-w / 2, -h); ctx.lineTo(w / 2, 0);\n    ctx.moveTo(w / 2, -h); ctx.lineTo(-w / 2, 0); ctx.stroke();\n    ctx.strokeStyle = '#2a333f'; ctx.strokeRect(-w / 2, -h, w, h);\n  }else{\n    const metal = o.kind === 'drum';\n    const bg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);\n    if(metal){ bg.addColorStop(0, '#2c4149'); bg.addColorStop(0.42, '#5b7b85'); bg.addColorStop(1, '#25373f'); }\n    else{ bg.addColorStop(0, '#41342a'); bg.addColorStop(0.42, '#a08258'); bg.addColorStop(1, '#3b3026'); }\n    ctx.fillStyle = bg;\n    ctx.beginPath(); ctx.moveTo(-w / 2 * 0.86, -h);\n    ctx.quadraticCurveTo(-w / 2 * 1.1, -h / 2, -w / 2 * 0.86, 0);\n    ctx.lineTo(w / 2 * 0.86, 0);\n    ctx.quadraticCurveTo(w / 2 * 1.1, -h / 2, w / 2 * 0.86, -h);\n    ctx.closePath(); ctx.fill();\n    ctx.strokeStyle = metal ? '#1d2c33' : '#3b4452'; ctx.lineWidth = 3 * s;\n    for(const yy of [-h * 0.78, -h * 0.5, -h * 0.22]){\n      ctx.beginPath(); ctx.moveTo(-w / 2 * 1.02, yy); ctx.lineTo(w / 2 * 1.02, yy); ctx.stroke();\n    }\n    ctx.fillStyle = metal ? '#6d8d97' : C.wood;\n    ctx.beginPath(); ctx.ellipse(0, -h, w / 2 * 0.86, 7 * s, 0, 0, 7); ctx.fill();\n  }\n  ctx.restore();\n}\n\n/* =========================================================\n   주인공 — 원작 캐릭터 시트(청록 후드 자켓 · 크림 티 ·\n   차콜 카고 반바지 · 흰 양말 · 갈색 등산화)에 구명조끼\n   ========================================================= */\nfunction drawPlayer(g, x, z, rot, dy, falling){\n  const p = proj(x, z), s = p.s, X = p.sx, Y = p.sy + (dy || 0);\n  const F = gender === 'female';\n  if(!falling) shadow(X, p.sy, 22 * s, 6.5 * s);\n\n  ctx.save(); ctx.translate(X, Y); ctx.rotate(rot); ctx.scale(s, s);\n\n  const walk = falling ? 0 : Math.sin(g.step);\n  const armSw = Math.sin(g.t * 5.5) * 3;\n\n  /* 다리 · 양말 · 등산화 */\n  for(const side of [-1, 1]){\n    const off = walk * 5 * side;\n    ctx.fillStyle = C.skin;\n    ctx.fillRect(side * 9 - 6 + off * 0.4, -46, 12, 26);\n    ctx.fillStyle = C.sock;\n    ctx.fillRect(side * 9 - 6.5 + off * 0.6, -22, 13, 11);\n    ctx.fillStyle = C.boot;\n    ctx.beginPath();\n    ctx.moveTo(side * 9 - 7 + off, -12); ctx.lineTo(side * 9 + 6 + off, -12);\n    ctx.lineTo(side * 9 + 9 + off, -1); ctx.lineTo(side * 9 - 9 + off, -1);\n    ctx.closePath(); ctx.fill();\n    ctx.fillStyle = '#3d2a1c'; ctx.fillRect(side * 9 - 9 + off, -3, 18, 3);\n  }\n\n  /* 차콜 카고 반바지 */\n  ctx.fillStyle = C.shorts;\n  ctx.beginPath(); ctx.moveTo(-21, -72); ctx.lineTo(21, -72);\n  ctx.lineTo(19, -42); ctx.lineTo(3, -42); ctx.lineTo(0, -52);\n  ctx.lineTo(-3, -42); ctx.lineTo(-19, -42); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = '#2c3138';\n  ctx.fillRect(-20, -62, 7, 11); ctx.fillRect(13, -62, 7, 11);\n\n  /* 크림색 티셔츠 */\n  ctx.fillStyle = C.tee;\n  ctx.beginPath(); ctx.moveTo(-19, -102); ctx.lineTo(19, -102);\n  ctx.lineTo(21, -66); ctx.lineTo(-21, -66); ctx.closePath(); ctx.fill();\n\n  /* 청록 후드 자켓 (열린 앞섶) */\n  ctx.fillStyle = C.jacket;\n  ctx.beginPath(); ctx.moveTo(-24, -104); ctx.lineTo(-7, -102);\n  ctx.lineTo(-9, -62); ctx.lineTo(-24, -62); ctx.closePath(); ctx.fill();\n  ctx.beginPath(); ctx.moveTo(24, -104); ctx.lineTo(7, -102);\n  ctx.lineTo(9, -62); ctx.lineTo(24, -62); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = C.jacketLo;\n  ctx.fillRect(-24, -104, 5, 42); ctx.fillRect(19, -104, 5, 42);\n\n  /* 팔 */\n  ctx.strokeStyle = C.jacket; ctx.lineWidth = 11; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(-19, -99); ctx.lineTo(-34, -74 - armSw); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(19, -99); ctx.lineTo(34, -74 + armSw); ctx.stroke();\n  ctx.fillStyle = C.skin;\n  ctx.beginPath(); ctx.arc(-35, -71 - armSw, 5.5, 0, 7); ctx.fill();\n  ctx.beginPath(); ctx.arc(35, -71 + armSw, 5.5, 0, 7); ctx.fill();\n\n  /* ===== 구명조끼 ===== */\n  ctx.fillStyle = C.vest;\n  ctx.beginPath();\n  ctx.moveTo(-22, -106); ctx.lineTo(22, -106);\n  ctx.lineTo(21, -74); ctx.quadraticCurveTo(0, -67, -21, -74);\n  ctx.closePath(); ctx.fill();\n  ctx.fillStyle = C.vestLo;\n  ctx.fillRect(-4, -106, 8, 33);\n  ctx.beginPath(); ctx.moveTo(-22, -106); ctx.lineTo(-15, -106);\n  ctx.lineTo(-14, -75); ctx.lineTo(-21, -74); ctx.closePath(); ctx.fill();\n  ctx.fillStyle = '#ffe2b4';\n  ctx.fillRect(-22, -98, 44, 4.5); ctx.fillRect(-22, -85, 43, 4.5);\n  ctx.fillStyle = '#2b3138';\n  ctx.fillRect(-22, -92.5, 44, 3.6); ctx.fillRect(-22, -79.5, 43, 3.6);\n  ctx.fillStyle = '#d7dee4';\n  ctx.fillRect(-5, -93.5, 10, 5.6); ctx.fillRect(-5, -80.5, 10, 5.6);\n  ctx.fillStyle = C.vestHi;\n  ctx.beginPath(); ctx.ellipse(0, -108, 18, 8.5, 0, Math.PI, 0); ctx.fill();\n  ctx.fillStyle = C.vest;\n  ctx.beginPath(); ctx.ellipse(0, -107, 11, 5, 0, Math.PI, 0); ctx.fill();\n\n  /* 목 · 머리 */\n  ctx.fillStyle = C.skinLo; ctx.fillRect(-5, -116, 10, 10);\n  ctx.fillStyle = C.skin;\n  ctx.beginPath(); ctx.ellipse(0, -130, 16, 17.5, 0, 0, 7); ctx.fill();\n\n  const hair = '#221a18', hairHi = '#3c2e29';\n  if(F){\n    ctx.fillStyle = hair;\n    ctx.beginPath(); ctx.ellipse(16, -124, 8, 19, -0.35, 0, 7); ctx.fill();\n    ctx.beginPath(); ctx.ellipse(19, -108, 6.5, 12, -0.5, 0, 7); ctx.fill();\n  }\n  ctx.fillStyle = hair;\n  ctx.beginPath(); ctx.ellipse(0, -134, 17.5, 16, 0, Math.PI, 0); ctx.fill();\n  if(F){\n    ctx.beginPath(); ctx.moveTo(-17.5, -134); ctx.lineTo(-15, -118); ctx.lineTo(-8, -134); ctx.closePath(); ctx.fill();\n    ctx.beginPath(); ctx.moveTo(17.5, -134); ctx.lineTo(15, -117); ctx.lineTo(8, -134); ctx.closePath(); ctx.fill();\n    ctx.beginPath(); ctx.ellipse(-2, -139, 17, 11, 0, Math.PI, 0); ctx.fill();\n  }else{\n    ctx.beginPath();\n    ctx.moveTo(-17.5, -133); ctx.lineTo(-11, -147); ctx.lineTo(-5, -136);\n    ctx.lineTo(1, -149); ctx.lineTo(7, -136); ctx.lineTo(13, -146);\n    ctx.lineTo(17.5, -133); ctx.closePath(); ctx.fill();\n  }\n  ctx.fillStyle = hairHi;\n  ctx.beginPath(); ctx.ellipse(-6, -140, 7, 3.4, -0.3, 0, 7); ctx.fill();\n\n  /* 얼굴 */\n  ctx.fillStyle = '#20191a';\n  ctx.beginPath(); ctx.ellipse(-6, -129, 2.6, 3.4, 0, 0, 7); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(6, -129, 2.6, 3.4, 0, 0, 7); ctx.fill();\n  ctx.fillStyle = '#ffffff';\n  ctx.beginPath(); ctx.arc(-5.2, -130.4, 1, 0, 7); ctx.fill();\n  ctx.beginPath(); ctx.arc(6.8, -130.4, 1, 0, 7); ctx.fill();\n  ctx.strokeStyle = '#20191a'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(-9.5, -136.5); ctx.lineTo(-3.5, -135.5); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(9.5, -136.5); ctx.lineTo(3.5, -135.5); ctx.stroke();\n  ctx.strokeStyle = '#4a2c27'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.arc(0, -124, 3.6, 0.3, Math.PI - 0.3); ctx.stroke();\n  ctx.fillStyle = 'rgba(226,132,114,0.32)';\n  ctx.beginPath(); ctx.ellipse(-10, -125, 3.6, 2.2, 0, 0, 7); ctx.fill();\n  ctx.beginPath(); ctx.ellipse(10, -125, 3.6, 2.2, 0, 0, 7); ctx.fill();\n\n  ctx.restore();\n}\n\n/* ---- 물보라 · 거대한 파도 · 비 ---- */\nfunction drawSplash(g){\n  const f = g.fall, p = proj(f.x, f.z), a = Math.max(0, 1 - f.splash * 1.4);\n  const Y = Math.min(H - 20, p.sy + 30);\n  ctx.save(); ctx.globalAlpha = a;\n  ctx.strokeStyle = C.foamHi; ctx.lineWidth = 3;\n  for(let i = 1; i \u003c= 3; i++){\n    ctx.beginPath();\n    ctx.ellipse(p.sx, Y, 30 * i * (0.4 + f.splash * 1.6), 9 * i * (0.4 + f.splash), 0, 0, 7);\n    ctx.stroke();\n  }\n  ctx.fillStyle = '#eafaff';\n  for(let i = 0; i \u003c 14; i++){\n    const an = (i / 14) * Math.PI * 2, d = f.splash * 150;\n    ctx.beginPath();\n    ctx.arc(p.sx + Math.cos(an) * d, Y + Math.sin(an) * d * 0.35 - 44 * (1 - f.splash), 3.4, 0, 7);\n    ctx.fill();\n  }\n  ctx.restore();\n}\n\nfunction drawBigWave(g, layer){\n  const T = g.wave.T;\n  ctx.save();\n  if(layer === 'back'){\n    /* 뱃머리 너머에서 솟구쳐 오르는 물의 벽 */\n    const rise = Math.min(1, T / 1.5);\n    const top = H * 0.46 - rise * H * 0.52;\n    const crest = x => top + Math.sin(x * 0.0095 + g.t * 2.8) * 30 + Math.sin(x * 0.028 + g.t * 4.4) * 13;\n    const wg = ctx.createLinearGradient(0, top, 0, H * 0.95);\n    wg.addColorStop(0, '#9dc3d6'); wg.addColorStop(0.10, '#3d6c8c');\n    wg.addColorStop(0.55, '#1d3f5c'); wg.addColorStop(1, '#122c44');\n    ctx.fillStyle = wg;\n    ctx.beginPath(); ctx.moveTo(-40, H + 40);\n    for(let x = -40; x \u003c= W + 40; x += 14) ctx.lineTo(x, crest(x));\n    ctx.lineTo(W + 40, H + 40); ctx.closePath(); ctx.fill();\n\n    ctx.strokeStyle = C.foamHi; ctx.lineWidth = 11; ctx.lineJoin = 'round';\n    ctx.beginPath();\n    for(let x = -40; x \u003c= W + 40; x += 14){ x === -40 ? ctx.moveTo(x, crest(x)) : ctx.lineTo(x, crest(x)); }\n    ctx.stroke();\n    ctx.fillStyle = '#ffffff';\n    for(let i = 0; i \u003c 70; i++){\n      const x = (i * 131 + g.t * 120) % (W + 80) - 40;\n      ctx.globalAlpha = 0.55 * rise;\n      ctx.beginPath(); ctx.arc(x, crest(x) - ((i * 17) % 86) * rise, 2 + (i % 4), 0, 7); ctx.fill();\n    }\n    ctx.globalAlpha = 1;\n    // 물벽 안쪽의 결\n    ctx.strokeStyle = 'rgba(160,196,220,0.35)'; ctx.lineWidth = 3;\n    for(let k = 1; k \u003c= 4; k++){\n      ctx.beginPath();\n      for(let x = -40; x \u003c= W + 40; x += 20) ctx.lineTo(x, crest(x) + k * 34);\n      ctx.stroke();\n    }\n  }else{\n    /* 갑판을 삼키며 차오르는 물 */\n    const surge = Math.max(0, Math.min(1, (T - 1.3) / 1.7));\n    if(surge \u003c= 0){ ctx.restore(); return; }\n    const base = H * 1.12 - surge * H * 0.95;\n    const line = x => base + Math.sin(x * 0.013 + g.t * 5) * 13 + Math.sin(x * 0.037 + g.t * 7) * 6;\n    const fg = ctx.createLinearGradient(0, base, 0, H);\n    fg.addColorStop(0, 'rgba(122,168,196,0.88)'); fg.addColorStop(0.2, 'rgba(37,82,112,0.92)');\n    fg.addColorStop(1, 'rgba(12,30,48,0.96)');\n    ctx.fillStyle = fg;\n    ctx.beginPath(); ctx.moveTo(-40, H + 60);\n    for(let x = -40; x \u003c= W + 40; x += 14) ctx.lineTo(x, line(x));\n    ctx.lineTo(W + 40, H + 60); ctx.closePath(); ctx.fill();\n\n    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.lineJoin = 'round';\n    ctx.globalAlpha = 0.9;\n    ctx.beginPath();\n    for(let x = -40; x \u003c= W + 40; x += 14){ x === -40 ? ctx.moveTo(x, line(x)) : ctx.lineTo(x, line(x)); }\n    ctx.stroke();\n    ctx.fillStyle = '#ffffff';\n    for(let i = 0; i \u003c 80; i++){\n      const x = (i * 89 + g.t * 170) % (W + 80) - 40;\n      ctx.globalAlpha = 0.7 * surge;\n      ctx.beginPath(); ctx.arc(x, line(x) - ((i * 19) % 60) * surge, 2 + (i % 5), 0, 7); ctx.fill();\n    }\n  }\n  ctx.restore();\n}\n\nfunction drawRain(g, tilt){\n  ctx.strokeStyle = 'rgba(206,226,240,0.32)'; ctx.lineWidth = 1.2;\n  ctx.beginPath();\n  for(const r of g.rain){\n    r.y += (0.9 + r.s) * 0.021; r.x += tilt * 0.004;\n    if(r.y > 1){ r.y = -0.05; r.x = Math.random(); }\n    if(r.x > 1) r.x -= 1; if(r.x \u003c 0) r.x += 1;\n    const X = r.x * W, Y = r.y * H;\n    ctx.moveTo(X, Y); ctx.lineTo(X + tilt * 22 - 4, Y + 19 * r.s);\n  }\n  ctx.stroke();\n}\n\n/* ---------------- HUD ---------------- */\nfunction hud(g){\n  const left = Math.max(0, DUR - g.elapsed);\n  $('#hudTime').textContent = left.toFixed(1);\n  $('#timeFill').style.width = (g.elapsed / DUR * 100) + '%';\n  $('#hudScore').textContent = scoreOf(g.elapsed);\n  const m = $('#tiltMark');\n  m.style.left = (50 + g.tilt * 46) + '%';\n  m.classList.toggle('danger', Math.abs(g.tilt) > 0.55 || Math.abs(g.px) > 0.6);\n  const w = $('#warn');\n  if(g.phase === 'wave'){\n    w.textContent = '거대한 파도가 덮친다!'; w.style.opacity = 1;\n  }else if(g.phase === 'play' && Math.abs(g.tilt) > 0.22){\n    w.textContent = g.tilt \u003c 0 ? '◀ 왼쪽으로 기운다 — 오른쪽 방향키!' : '오른쪽으로 기운다 — 왼쪽 방향키! ▶';\n    w.style.opacity = Math.min(1, (Math.abs(g.tilt) - 0.22) * 4);\n  }else w.style.opacity = 0;\n}\n\nfunction scoreOf(sec){\n  const s = Math.min(DUR, Math.floor(sec + 1e-6));\n  return Math.max(0, 100 - (DUR - s) * 5);\n}\n\n/* ---------------- 루프 ---------------- */\nfunction loop(ts){\n  raf = requestAnimationFrame(loop);\n  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;\n  if(!G) return;\n  step(G, dt); draw(G); hud(G);\n}\n\n/* ---------------- 화면 ---------------- */\nfunc  {id:'team',title:'이 탐험의 주인공',friend:'ha',correct:1,options:['시간을 아끼려고 혼자 먼저 숲길을 살펴본다','인원과 물품을 확인하고 역할을 나눠 함께 출발한다'],replies:['“잠깐, 길을 모르는 숲에서 흩어지면 서로 찾기 어려워. 먼저 역할을 나누자!” 나는 돌아와 친구들과 물품을 확인했다.','“좋아! 내가 주변을 살필게. 지도는 민서, 도구는 준호가 맡자.” 우리는 역할을 나누고 함께 출발했다.']},
 {id:'bridge',title:'다리를 고치기 전',friend:'jun',chapter:0,correct:1,prompt:'네 보강재가 비슷해 보인다. 어떻게 비교할까?',options:['모양이 비슷한 두 개를 골라 바로 설치한다','길이와 각의 표시를 비교한 뒤 두 개를 고른다'],replies:['“비슷해 보여도 크기가 다르면 맞지 않아. 길이와 각을 먼저 보자!” 우리는 설계도를 다시 펼쳤다.','“좋아. 같은 길이와 각이 어디인지 찾아보자!” 우리는 보강재의 표시를 살펴보기로 했다.']},
 {id:'watch',title:'땅을 파기 전',friend:'min',chapter:1,correct:0,prompt:'지도에는 송신기 위치가 표시되어 있지 않다. 어디부터 시작할까?',options:['기록을 다시 읽고 지도에서 거리를 비교한다','세 관측소의 가운데처럼 보이는 곳부터 파 본다'],replies:['“맞아. 세 관측소에서 같은 거리라는 기록이 단서야.” 우리는 지도에 선을 그려 비교하기로 했다.','“눈대중만으로는 세 거리가 같은지 알 수 없어. 먼저 지도에서 확인하자!” 나는 삽을 내려놓고 지도를 펼쳤다.']},
 {id:'camp',title:'텐트를 펼치기 전',friend:'ha',chapter:2,correct:1,prompt:'해가 지고 있다. 텐트 자리를 어떻게 정할까?',options:['설치가 쉬워 보이는 평평한 자리에 바로 펼친다','지도에 표시된 세 경계와의 거리를 확인한다'],replies:['“평평해도 밀물이나 낙석 경계와 가까울 수 있어. 지도부터 보자!” 우리는 텐트를 잠시 내려놓고 거리를 확인했다.','“좋아. 평평해 보이는 것만으로 정하지 말자.” 우리는 세 경계선까지의 거리를 비교하기로 했다.']},
 {id:'shed',title:'닫힌 문 앞에서',friend:'jun',chapter:3,correct:0,prompt:'도구가 보이는데 문이 열리지 않는다. 무엇을 먼저 할까?',options:['문이 걸린 원인과 보강틀 설계도를 확인한다','친구들을 더 불러 문을 한꺼번에 세게 당긴다'],replies:['“좋아. 처진 가로보를 받칠 틀부터 찾자!” 우리는 설계도의 특징을 확인했다.','“힘만 더 주면 문이나 가로보가 망가질 수 있어. 보강틀부터 확인하자!” 우리는 손잡이를 놓고 설계도를 살폈다.']},
 {id:'rockfall',title:'다음 행동을 정하자',friend:'ha',correct:1,options:['원래 길이 빠르니 쌓인 바위를 넘어가 본다','막힌 길에서 물러나 지도에서 우회로를 찾는다'],replies:['“바위가 더 떨어질 수도 있어. 원래 길로 가지 말자!” 우리는 물러나 지도의 해안 우회로를 확인했다. 준호가 목재와 밧줄을 꺼냈다.','“좋아, 여기 해안 우회로가 있어!” 준호가 목재와 밧줄을 가리켰다. “뗏목을 만들자!”']},
 {id:'raft',title:'물에 띄우기 전',friend:'min',chapter:4,correct:1,prompt:'통나무 바닥틀이 옆으로 기울어 있다. 어떻게 할까?',options:['물에 뜨는지부터 확인하고, 띄운 뒤 모양을 맞춘다','육지에서 틀의 모양과 연결 상태를 확인한다'],replies:['“물 위에서는 틀을 맞추기 더 어려워. 여기서 먼저 고치자!” 우리는 바닥틀과 연결부를 살펴봤다.','“좋아. 먼저 모양을 맞추고 연결부를 확인하자!” 우리는 밧줄과 보강틀을 준비했다.']},
 {id:'tower',title:'송신기를 켜기 전',friend:'jun',chapter:5,correct:0,prompt:'송신기는 연결됐지만 지지틀이 비뚤어져 있다. 무엇부터 할까?',options:['정비 기록에 맞춰 지지틀을 조절하고 확인한다','일단 송신 버튼을 여러 번 눌러 반응을 살핀다'],replies:['“좋아. 지지틀을 맞춘 뒤 구조 요청을 보내자!” 우리는 정비 기록을 펼쳤다.','“버튼만 다시 눌러도 비뚤어진 틀은 그대로야. 기록대로 먼저 맞추자!” 나는 버튼에서 손을 떼고 지지대를 살폈다.']}
];
function storyDecisionFor(line){const title=line?.[1]==='우리의 첫 번째 결정'?'이 탐험의 주인공':line?.[1];return storyDecisions.find(d=>d.title===title)}
function decisionRecord(d){return state.storyChoices?.[d.id]||(d.id==='ship'?state.shipChoice:null)}
for(const d of storyDecisions){if(Number.isInteger(d.chapter))before[d.chapter].push(['you',d.title,d.prompt,d.options,d.replies])}
// Replace the old neutral choices as each story is opened, before name/HTML escaping.
const playBeforeDecisions=playStory;
playStory=function(lines,bg,label,finish){
 lines=lines.map(l=>{const d=storyDecisionFor(l);return d?[l[0],l[1],d.prompt||l[2],d.options,d.replies]:l});
 playBeforeDecisions(lines,bg,label,finish);
};
const chooseBeforeDecisions=chooseStory;
chooseStory=function(i){
 const d=storyDecisionFor(tale?.lines[tale.index]);if(!d)return chooseBeforeDecisions(i);
 if(i!==0&&i!==1)return;
 let record=decisionRecord(d);
 if(!record){record={answer:i,points:i===d.correct?10:-10};state.storyChoices??={};state.storyChoices[d.id]=record;if(d.id==='ship')state.shipChoice=record;save()}
 chooseBeforeDecisions(record.answer);
};
const paintBeforeDecisions=paintStory;
paintStory=function(){
 const d=storyDecisionFor(tale?.lines[tale.index]),record=d&&decisionRecord(d);
 if(record)tale.answers[tale.index]=record.answer;
 paintBeforeDecisions();
 if(d){const note=sd.querySelector('.stageNote');if(note)note.textContent+=' · '+(record?(record.points>0?'+10점':'−10점')+' 반영':'행동 선택 · +10점 / −10점')}
};
const endBeforeDecisions=endStory;
endStory=function(){
 const i=tale?.lines.findIndex(l=>{const d=storyDecisionFor(l);return d&&!decisionRecord(d)});
 if(i>=0){tale.index=i;paintStory();return}
 endBeforeDecisions();
};
