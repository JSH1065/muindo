</style><script id="stairsBonusCode">const stairAssets={"heroes":"images/35-heroes.webp","summit":"images/36-summit.webp"};
(()=>{
 const dlg=document.createElement('dialog');dlg.id='stairBonusDialog';dlg.setAttribute('aria-label','보너스 게임 · 신호탑으로 오르는 계단');document.body.append(dlg);
 const pics={},duration=30000;let ready=false,run=null,resume=null,raf=0,deadline=0,lastInput=-Infinity,viewIndex=0,toastUntil=0,lastSave=0;

 const el=s=>dlg.querySelector(s),signed=n=>(n>0?'+':'')+n;
 function fresh(){return {remaining:duration,steps:0,mistakes:0,index:0,path:[0],phase:'ready',facing:1,gender:state.player?.gender||'male'}}
 function extend(){while(run.path.length<run.index+22){const n=run.path.length,last=run.path[n-1];let d=Math.random()<.5?-1:1;if(last<=-3)d=1;if(last>=3)d=-1;run.path.push(last+d)}}
 function saveRun(){if(run&&!state.stairsBonus){state.stairsRun={remaining:run.remaining,steps:run.steps,mistakes:run.mistakes,index:run.index,path:run.path.slice(),gender:run.gender};save()}}
 function open(done){if(dlg.open)return;resume=done;run=fresh();if(state.stairsRun&&!state.stairsBonus){Object.assign(run,state.stairsRun);run.phase='ready'}extend();viewIndex=run.index;
  dlg.innerHTML=`<div class="stairShell"><div class="stairTop"><div class="stairTitle"><small>BONUS · 마지막 오르막</small><b>${esc(playerName())} · 신호탑을 향해!</b></div><div class="stairNumbers"><span>남은 시간<strong id="stairTime">30.0초</strong></span><span>보너스 점수<strong id="stairScore">0점</strong></span><button id="stairPause" class="small" disabled>Ⅱ 잠시 멈춤</button></div></div><div class="stairBoard"><canvas tabindex="0" aria-label="다음 계단 방향에 맞춰 왼쪽 또는 오른쪽 버튼을 누르세요"></canvas><div class="stairCallout" aria-live="polite">다음 계단이 있는 방향으로!</div><div class="stairShade"></div></div><div class="stairBottom"><button id="stairLeft" disabled aria-label="왼쪽 계단 오르기">← 왼쪽</button><p>다음 계단 방향을 보고<br>한 번씩 눌러 주세요.</p><button id="stairRight" disabled aria-label="오른쪽 계단 오르기">오른쪽 →</button></div></div>`;
  dlg.showModal();el('#stairLeft').onclick=()=>input(-1);el('#stairRight').onclick=()=>input(1);el('#stairPause').onclick=togglePause;
  el('canvas').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!e.repeat)input(e.key==='ArrowLeft'?-1:1)}};
  dlg.onkeydown=e=>{if(e.target.tagName!=='CANVAS'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!e.repeat)input(e.key==='ArrowLeft'?-1:1)}};
  showIntro();updateHUD();draw();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
  loading.then(()=>{if(dlg.open&&run.phase==='ready'){if(state.stairsBonus)showResult();else showIntro()}draw()}).catch(()=>{if(dlg.open)el('.stairShade').innerHTML='<div class="stairCard"><h2>그림을 불러오지 못했어요</h2><p>파일을 다시 열어 주세요.</p></div>'});
 }
 function overlay(html){el('.stairShade').hidden=false;el('.stairShade').innerHTML='<div class="stairCard">'+html+'</div>'}
 function showIntro(){overlay(`<h2>신호탑까지, 한 계단 더!</h2><p>다음 계단이 왼쪽이면 <b>←</b>, 오른쪽이면 <b>→</b><br>${state.stairsRun?'남은 시간부터 이어서 도전해요.':'30초 동안 최대한 높이 올라가세요.'}</p><div class="rules"><span class="plus">한 계단 성공 +1점</span><span class="minus">잘못 누르면 −1점</span></div><p>틀려도 같은 계단에서 계속할 수 있어요.</p><button id="stairStart" class="primary" ${ready?'':'disabled'}>${ready?'계단 오르기 시작':'그림을 준비하는 중…'}</button>`);el('#stairStart').onclick=start}
 function start(){if(!ready||run.phase!=='ready'||state.stairsBonus)return;run.phase='play';deadline=performance.now()+run.remaining;lastInput=-Infinity;el('.stairShade').hidden=true;controls(true);saveRun();el('canvas').focus({preventScroll:true})}
 function controls(on){el('#stairLeft').disabled=el('#stairRight').disabled=!on;el('#stairPause').disabled=!['play','paused'].includes(run.phase)}
 function input(dir){if(run?.phase!=='play')return;const now=performance.now();if(now>=deadline){finish();return}if(now-lastInput<160)return;lastInput=now;const next=run.path[run.index+1]-run.path[run.index];run.remaining=Math.max(0,deadline-now);
  if(dir===next){run.steps++;run.index++;run.facing=dir;run.hopAt=now;extend();notify('＋1점 · '+run.steps+'계단','#b6f6c9')}else{run.mistakes++;run.shakeAt=now;notify('−1점 · 다음 계단 방향을 다시 봐요','#ffc5ad')}

 }

 function finish(){if(!run||run.phase==='done')return;run.remaining=0;run.phase='done';if(!state.stairsBonus){state.stairsBonus={steps:run.steps,mistakes:run.mistakes,score:(run.steps-run.mistakes),durationSeconds:30};delete state.stairsRun;save()}updateHUD();controls(false);showResult()}
 function showResult(){run.phase='done';controls(false);const r={...state.stairsBonus,score:stairBonusScore()};run.remaining=0;run.steps=r.steps;run.mistakes=r.mistakes;updateHUD();overlay(`<h2>친구들과 정상에 도착!</h2><div class="score">${signed(r.score)}점</div><p>오른 계단 <b>${r.steps}개 × 1점</b><br>잘못 누른 횟수 <b>${r.mistakes}회 × −1점</b></p><p>보너스 점수를 탐험 기록에 반영했어요.<br>이제 송신기를 연결하고 구조 요청을 보내자!</p><button id="stairContinue" class="primary">신호탑 미션으로 →</button>`);el('#stairContinue').onclick=close;el('#stairContinue').focus({preventScroll:true})}
 function togglePause(){if(run?.phase==='play'){run.remaining=Math.max(0,deadline-performance.now());if(run.remaining<=0){finish();return}run.phase='paused';saveRun();controls(false);el('#stairPause').textContent='▶ 계속하기';overlay('<h2>잠시 쉬어가요</h2><p>시간이 멈췄습니다.</p><button id="stairResume" class="primary">계속 오르기</button>');el('#stairResume').onclick=togglePause}else if(run?.phase==='paused'){run.phase='play';deadline=performance.now()+run.remaining;el('.stairShade').hidden=true;el('#stairPause').textContent='Ⅱ 잠시 멈춤';controls(true);el('canvas').focus({preventScroll:true})}}
 function close(){if(run?.phase!=='done')return;cancelAnimationFrame(raf);dlg.close();dlg.innerHTML='';const done=resume;resume=null;run=null;if(done)done()}
 dlg.addEventListener('cancel',e=>{e.preventDefault();if(run?.phase==='play'||run?.phase==='paused')togglePause()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&dlg.open&&run?.phase==='play')togglePause()});window.addEventListener('blur',()=>{if(dlg.open&&run?.phase==='play')togglePause()});
 function tick(now){if(!dlg.open)return;if(run.phase==='play'){run.remaining=Math.max(0,deadline-now);if(run.remaining===0)finish();else if(now-lastSave>1000){saveRun();lastSave=now}updateHUD()}viewIndex+=(run.index-viewIndex)*.22;if(now>toastUntil&&run.phase==='play'){el('.stairCallout').textContent='다음 계단이 있는 방향으로!';el('.stairCallout').style.color='#fff6d4'}draw(now);raf=requestAnimationFrame(tick)}

<script id="quizClockCode">
(()=>{
 const LIMIT=180000;
 let owner=null,chapter=-1,last=0,active=false,lastSave=0;
 const points=ms=>Math.max(50,Math.ceil(100-50*Math.max(0,ms)/LIMIT));
 function elapsed(){const s=ensureScore();if(!Array.isArray(s.quizElapsed))s.quizElapsed=Array(6).fill(0);return s.quizElapsed}
 function settle(){const now=Date.now();if(owner===state&&active&&chapter>=0)elapsed()[chapter]+=Math.max(0,now-last);last=now}
 function permitted(){return window.classroom?.getRole()==='teacher'||(window.classroom?.getRole()==='student'&&state.chapter<=window.classroom.getRoom()?.allowedChapter)}
 function refresh(){
  settle();owner=state;chapter=state.chapter;
  const panel=document.querySelector('#app .panel'),valid=validPlayer(state.player)&&chapter>=0&&chapter<6&&!!document.querySelector('#puzzle');
  active=valid&&!solved&&ensureScore().points[chapter]===null&&permitted()&&!document.querySelector('dialog[open]');
  if(!valid)return;
  let box=document.querySelector('#quizClock');if(!box&&panel){box=document.createElement('div');box.id='quizClock';box.className='quizClock';panel.prepend(box)}if(!box)return;
  const ms=elapsed()[chapter],seconds=Math.ceil(Math.max(0,LIMIT-ms)/1000),done=ensureScore().points[chapter]!==null;
  const text='<span>퀴즈 시간 <strong>'+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')+'</strong> / 3:00</span><span>'+(done?'획득 점수':'완료 예상 점수')+' <strong>'+(done?chapterScore(chapter):points(ms))+'점</strong> / 100점</span><small>'+(done?'완료한 퀴즈의 점수는 유지됩니다.':ms>=LIMIT?'3분이 지났어요. 계속 풀 수 있으며 완료하면 50점을 받습니다.':!active?'잠시 멈춤 · 문제 화면으로 돌아오면 시간이 이어집니다.':'빨리 풀수록 높은 점수! 3분 이후에도 최저 50점으로 계속 도전할 수 있어요.')+'</small>';
  if(box.innerHTML!==text)box.innerHTML=text;box.classList.toggle('expired',ms>=LIMIT);
  if(active&&last-lastSave>=1000){lastSave=last;save()}
 }
 window.quizClock={points,refresh,finish(c){settle();active=false;return points(elapsed()[c])}};
 const previousEnter=enter;enter=function(c){settle();active=false;previousEnter(c);refresh()};
 const previousPlay=playStory;playStory=function(...args){settle();active=false;return previousPlay(...args)};
 const previousEnd=endStory;endStory=function(){previousEnd();refresh()};
 addEventListener('pagehide',()=>{settle();active=false;save()});
 new MutationObserver(refresh).observe(document.body,{subtree:true,attributes:true,attributeFilter:['open']});
 setInterval(refresh,200);refresh();
})();
</script>

const HEARTBEAT = 20000;          // 변화가 없어도 20초마다 접속 신호

const transport = {
  kind: 'firebase',
  label: 'Firebase 실시간 연결됨',
  async readRoom(c) { const s = await getDoc(roomRef(c)); const r = s.exists() ? s.data() : null; rooms.set(String(c), r); return r; },
  async writeRoom(c, r) { rooms.set(String(c), r); await setDoc(roomRef(c), clean(r)); },
  async putStudent(c, epoch, id, row) {
    let r = rooms.get(String(c));
    if (r === undefined) r = await transport.readRoom(c);
    if (!r || r.epoch !== epoch) return;
    const { lastSeen, ...rest } = row, body = JSON.stringify({ ...rest, record: { ...rest.record, updatedAt: 0 } }), prev = sent.get(id), now = Date.now();
    if (prev && prev.body === body && now - prev.at < HEARTBEAT) return;
    sent.set(id, { body, at: now });
    try {
      await setDoc(doc(studentsRef(c), String(id)), { epoch, data: JSON.stringify(row), updatedAt: now });
    } catch (e) { sent.delete(id); throw e; }
  },
  async resetRoom(c, r) {
    const snap = await getDocs(studentsRef(c));
    let batch = writeBatch(db), n = 0;
    batch.set(roomRef(c), clean(r));
    for (const d of snap.docs) { batch.delete(d.ref); if (++n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; } }
    await batch.commit();
    rooms.set(String(c), r); sent.clear();
  },
  subscribe(c, fn) {
    c = String(c);
    let room = rooms.get(c) ?? null, students = [], stopStudents = null;
    const emit = () => fn({ room, students: room ? students.filter(s => s.epoch === room.epoch) : [] });
    const onError = e => console.error("Firebase 구독 오류", e);
    const stopRoom = onSnapshot(roomRef(c), s => { room = s.exists() ? s.data() : null; rooms.set(c, room); emit(); }, onError);
    // 학생 명단은 교사 화면에서만 구독 (학생 기기는 수업 상태만 받음 → 읽기 사용량 절약)
    if (window.classroom?.getRole() === 'teacher') {
      stopStudents = onSnapshot(studentsRef(c), q => {
        students = q.docs.map(d => { try { return JSON.parse(d.data().data); } catch { return null; } }).filter(Boolean);
        emit();
      }, onError);
    }
    return () => { stopRoom(); stopStudents?.(); };
  }
};

try {
  if (window.__fbPending === false) throw Error('연결 시간 초과');
  await window.classroom.setTransport(transport);
} catch (e) { console.error('Firebase 연결 실패, 같은 브라우저 시험 모드로 계속합니다.', e); }
window.__fbPending = false;
if (!window.classroom.getRole()) window.classroom.roleGate();
</script>
